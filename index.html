<title>천천히, 제주</title>
<meta name="description" content="부모님과 함께 고르는 제주. 걷는 거리와 이동 시간으로 고른 지역·식당·코스">
<style>
/* 천천히, 제주 — 디자인 체계
   폭: 콘텐츠 최대 1280px, 좌우 여백 데스크톱 60px. 그리드: 12열, 열 간격 24px.
   색: 아이보리(바탕) · 네이비 블랙(글자·어두운 패널) · 감귤(선택·주요 버튼) · 회녹(보조 글자).
   선: 기본 1px, 활성만 2px. 어두운 패널은 화면마다 오른쪽 위 핵심 모듈 하나에만 쓴다.
   글자: 쪽 제목 48px/700 · 단락 제목 28px/700 · 본문 18px/400 · 보조 15px/500. */
@font-face{font-family:"Pretendard Variable";font-weight:45 920;font-style:normal;font-display:swap;
  src:url("PretendardVariable.woff2") format("woff2-variations"),url("PretendardVariable.woff2") format("woff2")}
:root{
  color-scheme:light;
  --bg:#F4F3EE;      /* 스톤 아이보리 */
  --ink:#202629;     /* 차콜 — 본문 */
  --panel:#1C292D;   /* 청록 블랙 — 큰 판 */
  --green:#526B64;   /* 제주 광물 녹색 — 주 버튼·선택 */
  --green-dk:#43594F;
  --terra:#B47761;   /* 테라코타 — 작은 표시만 */
  --terra-ink:#844A36;
  --rule:#D7D6CE;
  --cta:#9A5F4A; --cta-dk:#87513E;
  --sage:#495250;    /* 보조 글자 */
  --line:var(--rule);
  --line-dk:rgba(244,243,238,.18);
  --on-dk:#F4F3EE;
  --on-dk2:rgba(244,243,238,.82);
  --navy:var(--ink);
  --green-tx:#3F574F;
  --tint:rgba(32,38,41,.05);
  --kf-c:#844A36; --kf-b:rgba(180,119,97,.16);
  --ks-c:#3F574F; --ks-b:rgba(82,107,100,.16);
  --kr-c:#3E4644; --kr-b:rgba(32,38,41,.08);
  --ivory:var(--bg); --paper:var(--bg); --char:var(--ink); --ink-2:var(--sage); --accent:var(--green); --accent-ink:var(--green-tx);
  --font:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --gut:clamp(20px,4.4vw,60px);
}
html{font-size:18px}
html.s2{font-size:20px} html.s3{font-size:22px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--navy);font-family:var(--font);font-weight:400;font-size:1rem;line-height:1.7;letter-spacing:-.005em;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.025em;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:left}
a{color:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--green);outline-offset:3px}
.tnum{font-variant-numeric:tabular-nums}
.wrap{max-width:calc(1280px + 2 * var(--gut));margin:0 auto;padding-inline:var(--gut)}
.narrow{}
.g{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px}

/* 공통 글자 */
.kicker{font-size:.85rem;font-weight:500;color:var(--sage)}
.page-h{font-size:clamp(2.2rem,3.2vw,2.67rem);font-weight:700;letter-spacing:-.035em;line-height:1.22}
.page-h span{display:block}
.lead{font-size:1.1rem;color:var(--sage);max-width:24em}
.sec-t{font-size:1.56rem;font-weight:700;letter-spacing:-.025em}
.meta{font-size:.85rem;font-weight:500;color:var(--sage)}

/* 공통 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 26px;border:1px solid var(--navy);border-radius:2px;font-weight:600;font-size:1rem;text-decoration:none;white-space:nowrap;background:transparent;color:var(--navy)}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.primary{background:var(--cta);border-color:var(--cta);color:var(--on-dk)}
.btn.primary:hover{background:var(--cta-dk);border-color:var(--cta-dk);color:var(--on-dk)}
.btn.solid{background:var(--green);border-color:var(--green);color:var(--on-dk)}
.btn:disabled{opacity:.55;cursor:wait}
.dk .btn{border-color:var(--line-dk);color:var(--on-dk)}
.dk .btn:hover{background:rgba(244,243,238,.08);color:var(--on-dk)}
.dk .btn.primary{background:var(--cta);border-color:var(--cta);color:var(--on-dk)}
.dk .btn.primary:hover{background:var(--cta-dk);border-color:var(--cta-dk)}
.link{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px;text-decoration-color:var(--line);min-height:44px;display:inline-flex;align-items:center}
.link:hover{text-decoration-color:var(--navy)}
.tabs{display:flex;gap:0 28px;flex-wrap:wrap}
.tabs.sub{gap:0 22px;padding-top:6px;border-bottom:1px solid var(--line);margin-bottom:4px}
.tabs button{min-height:44px;min-width:44px;text-align:center;font-size:1rem;font-weight:500;color:var(--sage);border-bottom:2px solid transparent}
.tabs button[aria-pressed="true"]{color:var(--navy);border-bottom-color:var(--terra)}
.warn{color:var(--terra-ink);font-weight:600}
.dk{background:var(--panel);color:var(--on-dk)}

/* 머리 — 세 화면 공통 */
.mast{border-bottom:1px solid var(--line)}
.mast .wrap{display:flex;align-items:center;gap:32px;height:76px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;min-height:44px;margin-right:auto}
.brand svg{width:30px;height:30px;flex:none}
.brand b{font-size:1.15rem;font-weight:700;letter-spacing:-.03em;white-space:nowrap}
.nav{display:flex;gap:28px}
.nav button{min-height:44px;font-size:1rem;font-weight:500;color:var(--sage);border-bottom:2px solid transparent;white-space:nowrap}
.nav button[aria-current="true"]{color:var(--navy);border-bottom-color:var(--terra)}
.sizes{display:flex;align-items:center;gap:10px;padding-left:28px;border-left:1px solid var(--line);min-height:44px}
.sizes > span{font-size:.8rem;font-weight:500;color:var(--sage);white-space:nowrap}
.sizes .seg{display:flex;border:1px solid var(--line);border-radius:2px}
.sizes button{min-height:44px;min-width:44px;padding:0 10px;font-weight:600;color:var(--sage);line-height:1;white-space:nowrap}
.sizes .theme{min-height:44px;width:4.6em;text-align:center;padding:0;border:1px solid var(--line);border-radius:2px;font-weight:600;font-size:14px;color:var(--sage);white-space:nowrap}
.sizes .theme:hover{color:var(--ink);border-color:var(--ink)}
.sizes button + button{border-left:1px solid var(--line)}
.sizes button[aria-pressed="true"]{background:var(--green);color:var(--on-dk)}
.sizes button[data-s="1"]{font-size:14px}.sizes button[data-s="2"]{font-size:16.5px}.sizes button[data-s="3"]{font-size:19px}
main{min-height:60vh}

/* 바닥 — 세 화면 공통 */
.foot{margin-top:112px;border-top:1px solid var(--line)}
.foot .g{padding-block:56px 72px;row-gap:28px}
.foot .f-brand{grid-column:1/5;display:grid;gap:4px;align-content:start}
.foot .f-brand b{font-size:1.1rem;font-weight:700}
.foot .f-brand span,.foot .f-info p{font-size:.85rem;color:var(--sage)}
.foot .f-nav{grid-column:5/9;display:grid;gap:2px;align-content:start;justify-items:start}
.foot .f-nav button{min-height:44px;font-size:.95rem;font-weight:500}
.foot .f-nav button:hover{text-decoration:underline;text-underline-offset:4px}
.foot .f-cr{grid-column:9/13;justify-self:end;align-self:start}
.foot .f-cr .link{font-size:.9rem;font-weight:500}
.foot .f-info{grid-column:5/9;text-align:center;justify-items:center;display:grid;gap:4px;align-content:start}
.foot .f-info b{font-size:.85rem;font-weight:600}
.foot .f-info .link{min-height:36px;font-size:.9rem;justify-self:start;margin-top:6px}

/* 화면 첫 줄: 왼쪽 제목, 오른쪽 어두운 모듈 — 세 화면 공통 */
.top{padding-block:56px 0;align-items:start;row-gap:32px}
.top-copy{grid-column:1/6;display:grid;gap:22px;align-content:start;align-self:center;padding-bottom:24px}
.top-copy .btn{justify-self:start;margin-top:6px}
.top-mod{grid-column:6/13;min-width:0}

/* 요약 띠 — 코스·여행 준비 공통 */
.sumrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:24px;margin:48px 0 0;border-top:1px solid var(--navy)}
.sumrow div{padding:18px 0 4px}
.sumrow dt{font-size:.85rem;font-weight:500;color:var(--sage)}
.sumrow dd{margin:4px 0 0;font-size:1.5rem;font-weight:700;letter-spacing:-.02em;line-height:1.3}
.sumrow dd span{display:block;font-size:.85rem;font-weight:500;color:var(--sage);letter-spacing:0;margin-top:4px}

/* 단락 머리 */
.blk{margin-top:72px}
.blk-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px 24px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--navy)}
.blk-h p{font-size:.95rem;color:var(--sage)}

:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#141C1F; --ink:#E7E6E0; --panel:#1F2D32; --green:#526B64; --green-dk:#5E7A72; --green-tx:#9DB5AC;
  --terra:#B47761; --terra-ink:#D59D86; --rule:#2F3B3D; --sage:#A2ABA8; --tint:rgba(231,230,224,.06);
  --line-dk:rgba(244,243,238,.16);
  --kf-c:#F0C3B0; --kf-b:rgba(213,157,134,.24);
  --ks-c:#C8DDD5; --ks-b:rgba(157,181,172,.24);
  --kr-c:#E3E5E1; --kr-b:rgba(231,230,224,.16);
  --on-dk2:rgba(244,243,238,.84);}
:root[data-theme="dark"] .d-photo,:root[data-theme="dark"] .cover img{filter:brightness(.9)}
.drawer{color:var(--ink)}
/* ---------- 홈 ---------- */
.media{display:grid}
.mapbox{padding:36px 32px 20px}
.mapbox svg{width:100%;height:auto;display:block}
.zone{cursor:pointer}
.zone path{fill:rgba(244,243,238,.05);stroke:rgba(244,243,238,.45);stroke-width:1.2;transition:fill .2s}
.zone:hover path{fill:rgba(244,243,238,.14)}
.zone.on path{fill:var(--green);stroke:var(--on-dk)}
.zone.dim{opacity:.3}
.zone text{pointer-events:none;fill:var(--on-dk);font-family:var(--font);font-size:24px;font-weight:500;letter-spacing:-.02em}
.zone.on text{font-weight:700}
.zone:focus{outline:none}
.zone:focus-visible path{stroke:var(--on-dk);stroke-width:3}
.coast{fill:none;stroke:var(--on-dk);stroke-width:2;pointer-events:none}
.sel{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:end;gap:24px;margin:0 32px;padding:20px 0 28px;border-top:1px solid var(--line-dk)}
.sel .no{display:block;font-size:.85rem;font-weight:500;color:var(--on-dk2)}
.sel h2{font-size:1.56rem;font-weight:700;letter-spacing:-.025em;color:var(--on-dk)}
.sel .drv{display:grid;gap:2px}
.sel .drv span{font-size:.85rem;font-weight:500;color:var(--on-dk2)}
.sel .drv b{font-size:1.15rem;font-weight:700}
.sel .btn{min-height:46px;padding:0 20px}
.idx{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:24px;list-style:none;margin:0;padding:0}
.idx li{border-bottom:1px solid var(--line)}
.idx button{width:100%;display:grid;grid-template-columns:34px minmax(0,1fr);align-items:baseline;column-gap:8px;row-gap:4px;min-height:64px;padding:20px 0 22px;border-bottom:2px solid transparent;margin-bottom:-1px}
.idx .n{font-size:.95rem;font-weight:500;color:var(--sage)}
.idx b{font-size:1.05rem;font-weight:600;white-space:nowrap}
.idx small{grid-column:2;font-size:.85rem;color:var(--sage);white-space:nowrap}
.idx button:hover b{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}
.idx button[aria-current="true"]{border-bottom-color:var(--terra)}
.idx button[aria-current="true"] b,.idx button[aria-current="true"] .n{color:var(--accent-ink);font-weight:700}
.prev2 > div{grid-column:span 6}
.days.stale{opacity:.55}
.backbar{padding-top:20px}
.backbar + .top,.backbar + section{padding-top:20px}
.back{min-height:44px;font-size:1rem;font-weight:600;color:var(--navy);text-decoration:none;padding:0}
.back:hover{text-decoration:underline}
.situ{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;padding-block:16px 4px}
.situ span{font-size:.9rem;font-weight:500;color:var(--sage);margin-right:6px}
.situ button{min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:2px;font-weight:500;font-size:.95rem}
.situ button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--on-dk)}
.idx li.dim{opacity:.35}
.idx small em{font-style:normal;font-weight:700;color:var(--accent-ink)}
.acts-l{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-top:28px}

/* 체크리스트 — 홈·여행 준비 공통 */
.ck-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-block:20px 10px}
.ck-h h3{font-size:1.22rem;font-weight:700}
.ck{list-style:none;margin:0;padding:0;border-top:1px solid var(--navy)}
.ck li{border-bottom:1px solid var(--line);display:grid;grid-template-columns:40px minmax(0,1fr);align-items:baseline;gap:8px;padding-block:18px;font-size:1.05rem;line-height:1.5}
.ck label{display:grid;grid-template-columns:36px 26px minmax(0,1fr);gap:14px;align-items:center;min-height:66px;padding-block:12px;cursor:pointer;font-size:1.05rem;line-height:1.5}
.ck .no{font-size:1rem;color:var(--sage);font-weight:500}
.ck input{appearance:none;-webkit-appearance:none;width:24px;height:24px;margin:0;border:1.5px solid var(--navy);border-radius:2px;display:grid;place-items:center;cursor:pointer;background:transparent}
.ck input:checked + span{color:var(--sage)}
.ck-more{margin-top:8px}

/* ---------- 코스 ---------- */
.form{padding:32px 32px 28px;display:grid;gap:24px}
.form .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fld{display:grid;gap:6px;cursor:pointer}
.fld span{font-size:.85rem;font-weight:500;color:var(--sage)}
.dk .fld span{color:var(--on-dk2)}
.fld input{font:inherit;font-size:1rem;height:54px;width:100%;padding:0 14px;border:1px solid var(--navy);border-radius:2px;background:transparent;color:inherit;min-width:0;cursor:pointer}
.dk .fld input{border-color:var(--line-dk);color-scheme:dark}
.dk .fld input:hover,.dk .fld input:focus{border-color:var(--on-dk)}
.form .or{display:grid;gap:8px;padding-top:20px;border-top:1px solid var(--line-dk)}
.form .or > span{font-size:.85rem;font-weight:500;color:var(--on-dk2)}
.segs{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line-dk);border-radius:2px}
.segs.two{grid-template-columns:1fr 1fr}
.form.wide{grid-template-columns:1fr 1fr;column-gap:48px;padding:36px 40px 32px;align-items:start}
.f-col{display:grid;gap:22px}
.form.wide .or:first-of-type,.form.wide .stays{border-top:0;padding-top:0}
.form.wide .acts{border-top:1px solid var(--line-dk)}
.stay-row{margin-top:6px}
#soloR{max-width:320px}
.btn.reset{display:inline-flex;align-items:center;gap:8px}
.btn.reset svg{width:18px;height:18px;flex:none}
.chks{display:flex;flex-wrap:wrap;gap:0 28px}
.chk{display:inline-flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;font-weight:600;justify-self:start}
.chk input{width:22px;height:22px;margin:0;accent-color:var(--green);cursor:pointer}
.solo-note{font-size:min(.9rem,4vw);color:var(--on-dk2)}
.segs button{min-height:46px;text-align:center;font-weight:500;color:var(--on-dk2)}
.segs button + button{border-left:1px solid var(--line-dk)}
.segs button[aria-pressed="true"]{background:var(--green);color:var(--on-dk);font-weight:600;box-shadow:inset 0 0 0 1px rgba(244,243,238,.28)}
.segs.auto button[aria-pressed="true"]{background:transparent;color:var(--on-dk);box-shadow:inset 0 -2px 0 var(--terra)}
.opts{display:grid;gap:2px;padding-top:20px;border-top:1px solid var(--line-dk)}
.stays{display:grid;gap:10px;padding-top:20px;border-top:1px solid var(--line-dk)}
.stays > span{font-size:.85rem;font-weight:500;color:var(--on-dk2)}
.stay-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.fld select{font:inherit;font-size:.95rem;height:48px;width:100%;padding:0 10px;border:1px solid var(--line-dk);border-radius:2px;background:var(--panel);color:var(--on-dk);cursor:pointer;color-scheme:dark}
.fld select:hover,.fld select:focus{border-color:var(--on-dk)}
.opt{display:flex;gap:14px;align-items:center;font-size:1rem;min-height:46px;cursor:pointer}
.opt input{appearance:none;-webkit-appearance:none;width:24px;height:24px;margin:0;border:1.5px solid currentColor;border-radius:2px;display:grid;place-items:center;cursor:pointer;flex:none}
.acts{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding-top:20px;border-top:1px solid var(--line-dk)}
.acts .note{font-size:.85rem;color:var(--on-dk2);flex-basis:100%}
.status{font-size:.95rem;color:var(--on-dk2)}
.status:empty{display:none}
.days{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:24px;row-gap:48px;margin-top:28px}
.day{display:grid;grid-row:span 2;grid-template-rows:subgrid;row-gap:0}
.day-h{display:grid;gap:6px;align-content:start;padding-bottom:16px}
.day .dn{font-size:.85rem;font-weight:600;color:var(--accent-ink)}
.day h3{font-size:1.33rem;font-weight:700}
.day .stay,.day .dstat{font-size:.9rem;color:var(--sage)}
.day .dstat b{color:var(--navy)}
.day .hol{font-size:.9rem;font-weight:600;color:var(--terra-ink)}
.tl{list-style:none;margin:0;padding:0;border-top:1px solid var(--navy);align-self:start}
.tl li > *{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;padding:13px 0;border-bottom:1px solid var(--line);width:100%}
.tl time{font-size:.95rem;font-weight:500;color:var(--sage)}
.tl b{display:block;font-weight:700;font-size:1rem}
.tl small{display:block;font-size:.85rem;color:var(--sage)}
.tl .k{display:inline-block;font-size:.84rem;font-weight:700;padding:1px 7px;border-radius:2px;margin-right:8px;vertical-align:1px}
.tl .k{color:var(--kr-c);background:var(--kr-b);box-shadow:none}
.tl .k.kf{color:var(--kf-c);background:var(--kf-b);box-shadow:none}
.tl .k.ks{color:var(--ks-c);background:var(--ks-b);box-shadow:none}
.tl .k.ki{color:var(--ks-c);background:transparent;box-shadow:inset 0 0 0 1.5px var(--ks-c)}

/* ---------- 여행 준비 ---------- */
.cols3{column-gap:72px}
.cols3 > div{grid-column:span 4}
.top-copy:only-child{grid-column:1/-1}

/* ---------- 지역 ---------- */
.r-bar{display:flex;justify-content:space-between;gap:8px 24px;flex-wrap:wrap;align-items:center;font-size:.95rem;color:var(--sage);padding-block:8px 12px}
.r-bar nav{display:flex;gap:24px}
.cover-frame{max-width:calc(1280px + 2 * var(--gut));margin:0 auto;padding-inline:var(--gut)}
.cover-frame.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
.split .cover{height:clamp(380px,36vw,480px)}
.split .cover h1{font-size:clamp(2.4rem,3.4vw,3.4rem)}
.split .cover p{font-size:1.05rem}
.r-map{display:grid;align-content:center;gap:8px;padding:24px 28px}
.r-map p{font-size:.9rem;color:var(--on-dk2)}
.r-map svg{width:100%;height:auto;display:block;max-height:400px}

<script>
const R = window.REGIONS;
const BYID = {};
R.forEach((r, i) => { r.no = String(i + 1).padStart(2, "0"); [...r.spots, ...r.foods, ...r.rest, ...(r.drinks || [])].forEach(p => { p.region = r.id; BYID[p.id] = p; }); });
const RBY = Object.fromEntries(R.map(r => [r.id, r]));
const EX = window.EXTRAS || [];
EX.forEach(p => { p.extra = true; BYID[p.id] = p; });
const exOf = id => EX.filter(p => p.region === id).slice(0, 2);
const detourOf = p => { const d = Math.min(...RBY[p.region].spots.map(x => km(x, p))); return d <= 3 ? "명소 근처, 우회 거의 없음" : `가까운 명소에서 차로 약 ${Math.max(5, Math.round(d * 1.3 / 45 * 60 / 5) * 5)}분`; };
R.forEach(r => r.spots.forEach(s => { s.slopeYN = /^없음/.test(s.slope) ? "없음" : /계단|경사|오르막|언덕|완만/.test(s.slope) ? "있음" : "없음"; }));
const parkShort = t => { const x = String(t || "").replace(/\s*\(.*\)$/, "").replace(/^주차장\s*→\s*입구\s*/, "").replace(/^주차장\s*→\s*/, "").replace(/^(해변 |공영 |시장 공영 )?주차장 바로 앞/, "바로 앞"); return /^(약|바로)/.test(x) ? "입구까지 " + x : x; };
const CAT = { all: "전체", soup: "국·탕·죽", noodle: "국수", sea: "생선·해산물", set: "밥상·정식", meat: "고기", cafe: "카페", drink: "술 한잔" };
const TIER = { 1: "1순위", 2: "2순위", 3: "3순위" };
const TIER_DESC = { 1: "기다려도 갈 만한 집", 2: "비슷한 맛, 더 짧은 대기", 3: "믿을 만한 동네 식당" };
const WALK = { easy: "적음", mid: "보통", hard: "많음" };
const COVER_CREDIT = { jejusi: "yongduam", aewol: "hyeopjae", andeok: "yongmeori", jungmun: "jusang", seogwipo: "cheonjiyeon", namwon: "pyoseon", seongsan: "seongsan", gujwa: "hamdeok" };
const cover = r => `img/cover_${r.id}.jpg`;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const creditOf = id => { const c = (window.CREDITS || []).find(x => x.id === id); return c ? `사진: ${c.artist} / Wikimedia Commons, ${c.lic}` : ""; };
const parts = h => String(h || "").split(" · ");
const brkOf = h => (parts(h).find(x => x.startsWith("쉬는 시간")) || "").replace("쉬는 시간 ", "");
const offOf = h => parts(h).find(x => x.endsWith("휴무")) || "";
const openOf = h => parts(h).filter(x => !x.startsWith("쉬는 시간") && !x.endsWith("휴무")).join(" · ");
const waitTxt = f => f.waitMin ? `${f.wait} · 후기상 약 ${f.waitMin}분` : f.wait;
function km(a, b) { const t = Math.PI / 180, x = (b.lon - a.lon) * t * Math.cos((a.lat + b.lat) / 2 * t), y = (b.lat - a.lat) * t; return Math.sqrt(x * x + y * y) * 6371; }
const driveMin = (a, b) => Math.max(5, Math.round(km(a, b) * 1.3 / 45 * 60 / 5) * 5);

    <div class="cr-info"><h1 class="page-h">사진 출처</h1><p>이 페이지의 사진은 모두 Wikimedia Commons에서 퍼블릭 도메인이나 CC 라이선스로 공개된 것을 2026년 10월 9일에 내려받아 썼습니다. CC BY-SA 사진은 같은 라이선스 조건을 따릅니다.</p><p><button class="link" type="button" data-go="home">← 지역 선택으로</button></p></div>
    <div class="cr-main"><section class="cr-sec">
      <div class="cr-list">${(window.CREDITS || []).map(c => `<p><b>${esc(c.name)}</b>Image by ${esc(c.artist || "작가 미상")} / Wikimedia Commons · ${esc(c.lic)}<br><a href="${esc(c.url)}" target="_blank" rel="noopener">원본 페이지</a></p>`).join("")}</div>
    </section></div>
  </section>`;
}

/* ---------- 라우팅 ---------- */
let route = "home";
const ROUTES = ["home", "course", "prep", "credits"];
const backBar = () => route === "home" ? "" : `<div class="wrap backbar"><button class="link back" type="button" data-back>← 이전 화면</button></div>`;
function render() {
  const scr = $("#screen");
  if (route === "course") { if (!course.result) course.result = makeCourse(Date.now() % 1e9); scr.innerHTML = viewCourse(); }
  else if (route === "prep") scr.innerHTML = viewPrep();
  else if (route === "credits") scr.innerHTML = viewCredits();
  else if (RBY[route]) scr.innerHTML = viewRegion(route);
  else scr.innerHTML = viewHome();
  if (route !== "home" && (ROUTES.includes(route) || RBY[route])) scr.insertAdjacentHTML("afterbegin", backBar());
  document.querySelectorAll(".nav button,.tabbar button").forEach(b => b.setAttribute("aria-current", String(b.dataset.go === route || (b.dataset.go === "home" && (route === "home" || !!RBY[route])))));
}
let hIdx = (history.state && history.state.i) || 0;
function focusTitle() { const h = $("#screen h1"); if (h) { h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); } }
function go(r, fromPop) {
  if (!fromPop && r !== route) {
    const inDrawer = !!(history.state && history.state.d);
    try { if (inDrawer) history.replaceState({ i: hIdx }, "", "#" + r); else history.pushState({ i: ++hIdx }, "", "#" + r); } catch (e) {}
  }
  if (RBY[r]) pick = r; route = r; st = { cat: "all", easy: false, scat: "all" }; closeDetail(true); render(); window.scrollTo(0, 0); focusTitle();
}
function goBack() { if (hIdx > 0) { try { history.back(); return; } catch (e) {} } go("home"); }
const changed = () => { course.dirty = true; course.msg = course.msg || "조건을 바꿨습니다. 버튼을 누르면 새 코스를 짭니다."; const y = window.scrollY; render(); window.scrollTo(0, y); };
const reroll = () => { course.dirty = false; course.result = makeCourse(Date.now() % 1e9); course.source = "rule"; render(); };
function setPick(id, focusMap) {
  pick = id; render();
  if (focusMap) document.querySelector(`.zone[data-pick="${id}"]`)?.focus();
  else { const m = document.getElementById("media"); if (m && m.getBoundingClientRect().bottom < 120) m.scrollIntoView({ behavior: "smooth", block: "start" }); document.querySelector(`.idx button[data-pick="${id}"]`)?.focus({ preventScroll: true }); }
}

document.addEventListener("click", e => {
  const fld = e.target.closest(".fld");
  if (fld) { const inp = fld.querySelector("input[type=date]"); if (inp) { if (e.target !== inp) e.preventDefault(); try { inp.showPicker(); } catch (err) { inp.focus(); } } }
  const t = e.target.closest("[data-go],[data-region],[data-open],[data-close],[data-cat],[data-easy],[data-nights],[data-copy],[data-pick],[data-scroll],[data-s],[data-tg],[data-situ],[data-scat],[data-airport],[data-back],#btnRoll,#btnReset,#btnTheme");
  if (!t) return;
  if (t.dataset.close !== undefined) return closeDetail();
  if (t.dataset.back !== undefined) return goBack();
  if (t.id === "btnTheme") { setTheme(isDark() ? "light" : "dark"); store.set("jeju-theme", document.documentElement.dataset.theme); return; }
  if (t.dataset.copy) { const v = t.dataset.copy, fail = () => { t.textContent = "복사가 안 됐어요. 번호를 길게 눌러 복사하세요"; }; try { navigator.clipboard.writeText(v).then(() => { t.textContent = "복사했습니다"; }, fail); } catch (err) { fail(); } return; }
  if (t.dataset.s) { document.documentElement.classList.remove("s2", "s3"); if (t.dataset.s !== "1") document.documentElement.classList.add("s" + t.dataset.s); document.querySelectorAll("[data-s]").forEach(b => b.setAttribute("aria-pressed", String(b === t))); store.set("jeju-fs", t.dataset.s); return; }
  if (t.dataset.scroll) { document.getElementById(t.dataset.scroll)?.scrollIntoView({ behavior: "smooth", block: "start" }); document.querySelector(".idx button")?.focus({ preventScroll: true }); return; }
  if (t.dataset.pick) return setPick(t.dataset.pick, !!t.closest(".zone"));
  if (t.dataset.go) { e.preventDefault(); return go(t.dataset.go); }
  if (t.dataset.region) return go(t.dataset.region);
  if (t.dataset.open) return openDetail(t.dataset.open);
  if (t.dataset.airport) return openAirport();
  if (t.dataset.cat) { st.cat = t.dataset.cat; const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if (t.dataset.scat) { st.scat = t.dataset.scat; const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if (t.dataset.easy) { st.easy = t.dataset.easy === "1"; const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if (t.dataset.situ) { situ = situ === t.dataset.situ ? null : t.dataset.situ; const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if (t.dataset.tg) { course[t.dataset.tg] = t.dataset.v === "1"; if (t.dataset.tg === "same") fitStays(); course.msg = ""; return changed(); }
  if (t.dataset.nights) { course.nights = +t.dataset.nights; fitStays(); course.to = ""; course.msg = ""; return changed(); }
  if (t.id === "btnReset") { Object.assign(course, { nights: 2, easy: true, rain: false, from: "", to: "", stays: [], same: true, solo: false, soloR: "", extra: false }); fitStays(); course.msg = "처음 설정으로 돌리고 새 코스를 짰습니다."; reroll(); document.getElementById("btnReset")?.focus(); return; }
  if (t.id === "btnRoll") { course.msg = course.dirty ? "바꾼 조건으로 짰습니다." : ""; return reroll(); }
});
document.addEventListener("change", e => {
  const el = e.target, id = el.id;
  if (id === "optSolo") course.solo = el.checked;
  else if (id === "optExtra") course.extra = el.checked;
  else if (el.dataset.solo !== undefined) course.soloR = el.value;
  else if (el.dataset.stay !== undefined) { course.stays[+el.dataset.stay] = el.value; if (course.same) fitStays(); }
  else if (id === "dFrom" || id === "dTo") { course[id === "dFrom" ? "from" : "to"] = el.value; if (id === "dFrom" && course.to && course.to <= course.from) course.to = ""; syncDates(); }
  else return;
  changed();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") return closeDetail();
  const dr = document.querySelector(".drawer");
  if (e.key === "Tab" && dr) {
    const f = [...dr.querySelectorAll("a[href],button")].filter(x => x.offsetParent); if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    else if (!dr.contains(document.activeElement)) { e.preventDefault(); f[0].focus(); }
    return;
  }
  if (e.key !== "Enter" && e.key !== " ") return;
  const z = e.target.closest?.(".zone");
  if (z) { e.preventDefault(); if (z.dataset.region) go(z.dataset.region); else setPick(z.dataset.pick, true); }
});
{ const s = store.get("jeju-fs", "1"); if (s !== "1") { document.documentElement.classList.add("s" + s); document.querySelectorAll("[data-s]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.s === s))); } }
const isDark = () => document.documentElement.dataset.theme === "dark";
function setTheme(t) { document.documentElement.dataset.theme = t === "light" ? "light" : "dark"; const b = $("#btnTheme"); if (b) { b.textContent = isDark() ? "밝게" : "어둡게"; b.setAttribute("aria-label", isDark() ? "밝은 화면으로" : "어두운 화면으로"); } }
setTheme(store.get("jeju-theme", "dark"));
const h0 = (location.hash || "").slice(1);
route = (ROUTES.includes(h0) || RBY[h0]) ? h0 : "home";
if (RBY[route]) pick = route;
render();
try { if (!history.state) history.replaceState({ i: 0 }, "", "#" + route); } catch (e) {}
window.addEventListener("popstate", e => {
  hIdx = (e.state && e.state.i) || 0;
  if ($("#drawerRoot").innerHTML) closeDetail(true);
  const h = location.hash.slice(1) || "home";
  if ((ROUTES.includes(h) || RBY[h]) && h !== route) go(h, true);
});

</script>
