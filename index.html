<title>제주 곁에</title>
<meta name="description" content="부모님과 함께 떠나는 편안한 제주 여행 안내서">
<style>
/* Layout: 인쇄 여행 안내서처럼 — 종이 바탕, 굵은 구분선과 가는 구분선, 12열 그리드, 8px 간격 체계.
   홈: 제목 → 짧은 설명 → 지역 선택(사진 아래 글). 지역: 머리글 → 요약 4칸 → 명소 비교표 → 맛집 비교표 → 쉬어가기 · 이동 메모 · 반나절 동선 3단. */
@font-face{font-family:"Pretendard Variable";font-weight:45 920;font-style:normal;font-display:swap;
  src:url("PretendardVariable.woff2") format("woff2-variations"),url("PretendardVariable.woff2") format("woff2")}
:root{
  color-scheme:light;
  --char:#1E1D1A;     /* 차콜 — 히어로 */
  --accent-2:#D2662C; /* 어두운 바탕용 감귤 */
  --paper:#F7F4EE;    /* 종이 */
  --ink:#1B1A17;      /* 먹 */
  --ink-2:#4A4741;    /* 설명 */
  --rule:#D9D3C7;     /* 가는 선 */
  --accent:#B9501A;   /* 감귤 — 번호와 강조에만 */
  --hover:#EFEAE0;
  --font:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
html{font-size:16px}
html.s2{font-size:18px} html.s3{font-size:20px}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-weight:400;font-size:1.0625rem;line-height:1.65;letter-spacing:-.005em;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.02em;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:left}
a{color:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.tnum{font-variant-numeric:tabular-nums}
.wrap{max-width:1680px;margin:0 auto;padding-inline:max(16px,4vw)}
.g{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:32px}
.kicker{font-size:.875rem;font-weight:500;color:var(--ink-2)}
.num{color:var(--accent);font-weight:500}
.hard{color:var(--accent);font-weight:500}
.link{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px;text-decoration-color:var(--rule)}
.link:hover{text-decoration-color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;height:48px;padding:0 24px;border:1px solid var(--ink);border-radius:2px;font-size:1rem;font-weight:500;text-decoration:none;white-space:nowrap}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.55;cursor:wait}
.tabs{display:flex;gap:4px 24px;flex-wrap:wrap}
.tabs button{font-size:1rem;font-weight:500;color:var(--ink-2);padding:8px 0;border-bottom:2px solid transparent}
.tabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.ph{background:#D8D1C3;display:grid;place-items:center}
.ph span{font-size:.875rem;font-weight:500;color:var(--ink-2)}

/* 머리 */
.mast{border-bottom:2px solid var(--ink)}
.mast .wrap{display:flex;align-items:center;gap:32px;min-height:80px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand svg{width:36px;height:36px;flex:none}
.brand b{display:block;font-size:1.25rem;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.brand small{display:block;font-size:.875rem;color:var(--ink-2)}
.nav{display:flex;gap:24px;margin-left:auto}
.nav button{font-size:1rem;font-weight:500;color:var(--ink-2);padding:8px 0;border-bottom:2px solid transparent}
.nav button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.sizes{display:flex;align-items:center;gap:8px;font-size:.875rem;color:var(--ink-2)}
.sizes button{width:36px;height:36px;border:1px solid var(--rule);border-radius:2px;text-align:center;font-weight:500}
.sizes button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.sizes button:nth-of-type(2){font-size:1.125rem}.sizes button:nth-of-type(3){font-size:1.25rem}
main{padding-block:56px 80px}
main.full{padding-block:0 80px}
.foot{border-top:2px solid var(--ink)}
.foot .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:24px 40px;font-size:.9375rem;color:var(--ink-2)}
.foot b{color:var(--ink);font-weight:500}

/* 홈: 차콜 히어로 — 왼쪽 제목·선택 정보, 오른쪽 큰 섬 지도. 아래는 지역 색인. */
main.full{max-width:none;padding:0}
.hero{background:var(--char);color:var(--paper)}
.hero .wrap{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:32px;align-items:center;padding-block:56px 48px;min-height:min(78vh,820px)}
.hero-l{grid-column:1/5;display:grid;gap:24px;align-content:center}
.hero-l h1{font-size:clamp(2.75rem,4.6vw,4.5rem);font-weight:800;letter-spacing:-.04em;line-height:1.1}
.hero-l .lead{font-size:1.125rem;color:#CFC8BA;max-width:26em}
.hero-l .tabs button{color:#A9A294}
.hero-l .tabs button[aria-pressed="true"]{color:var(--paper);border-bottom-color:var(--accent-2)}
.hero-l .filter > span{font-size:.9375rem;font-weight:500;color:#CFC8BA}
.pick{border-top:1px solid #4A4740;padding-top:24px;display:grid;gap:12px;min-height:15.5rem;align-content:start}
.pick .no{font-size:.9375rem;font-weight:500;color:var(--accent-2)}
.pick h2{font-size:2.25rem;font-weight:800;letter-spacing:-.03em}
.pick p{color:#CFC8BA;font-size:1.0625rem}
.pick dl{display:grid;grid-template-columns:repeat(2,auto);justify-content:start;gap:4px 32px;margin:0}
.pick dt{font-size:.875rem;color:#A9A294;font-weight:500}
.pick dd{margin:0;font-size:1.0625rem;font-weight:700}
.pick .btn{justify-self:start;margin-top:8px;border-color:var(--accent-2);background:var(--accent-2);color:#fff}
.pick .hint{color:#A9A294}
.hero-map{grid-column:5/13;min-width:0}
.hero-map svg{width:100%;height:auto;display:block;overflow:visible}
.zone path{fill:#E9E2D3;stroke:var(--char);stroke-width:2;transition:fill .25s}
.zone{cursor:pointer}
.zone:hover path{fill:#F4EEE2}
.zone.on path{fill:var(--accent-2)}
.zone.dim path{fill:#8C877C}
.zone text{pointer-events:none;fill:var(--char)}
.zone .zn{font:500 13px var(--font)}
.zone .zl{font:700 19px var(--font);letter-spacing:-.02em}
.zone.on text{fill:#fff}
.zone:focus{outline:none}
.zone:focus-visible path{stroke:var(--accent-2);stroke-width:4}
.halla{fill:none;stroke:var(--char);stroke-width:1;opacity:.35}
.map-cap{font-size:.875rem;color:#A9A294;margin-top:8px;text-align:right}
.index{padding-block:40px 0}
.index-h{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.index-h h2{font-size:1.5rem;font-weight:700}
.index-h p{font-size:1rem;color:var(--ink-2)}
.idx{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:24px;border-top:2px solid var(--ink)}
.idx button{display:grid;gap:8px;align-content:start;padding-top:16px;border-top:3px solid transparent;margin-top:-2px}
.idx button[aria-pressed="true"]{border-top-color:var(--accent)}
.idx .img{aspect-ratio:3/2;overflow:hidden;background:#D8D1C3}
.idx img{width:100%;height:100%;object-fit:cover}
.idx .n{font-size:.875rem;font-weight:500;color:var(--accent)}
.idx b{font-size:1.125rem;font-weight:700;line-height:1.3}
.idx small{font-size:.875rem;color:var(--ink-2)}
.idx .hit{color:var(--accent);font-weight:500}
.idx button.dim{opacity:.4}

/* 지역 */
.r-bar{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:.9375rem;color:var(--ink-2);padding-block:16px}
.r-bar nav{display:flex;gap:24px}
.cover{position:relative;height:min(62vh,640px);min-height:320px;overflow:hidden;background:var(--char);color:#fff}
.cover img{width:100%;height:100%;object-fit:cover}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.62) 0%,rgba(0,0,0,.28) 45%,rgba(0,0,0,.03) 78%,transparent 100%)}
.cover .wrap{position:absolute;left:0;right:0;bottom:0;z-index:1;padding-bottom:40px;display:grid;gap:12px;max-width:1680px}
.cover .no{font-size:1rem;font-weight:500}
.cover h1{font-size:clamp(2.75rem,5vw,4.5rem);font-weight:800;letter-spacing:-.04em;line-height:1.1}
.cover p{font-size:1.125rem;max-width:40em}
.cover .credit{position:absolute;right:16px;top:12px;z-index:1;font-size:.75rem;color:rgba(255,255,255,.85)}
.r-body{padding-top:0}
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--rule);margin:0 0 64px;padding-top:8px}
.sum div{padding:16px 24px 20px 0}
.sum div + div{padding-left:24px;border-left:1px solid var(--rule)}
.sum dt{font-size:.875rem;font-weight:500;color:var(--ink-2)}
.sum dd{margin:4px 0 0;font-size:1.25rem;font-weight:700;line-height:1.35}
.sum dd span{display:block;font-size:.9375rem;font-weight:400;color:var(--ink-2);margin-top:4px}
.sec{margin-bottom:64px}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;border-top:2px solid var(--ink);padding-top:16px;margin-bottom:8px}
.sec-h h2{font-size:1.75rem;font-weight:700}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:.875rem;font-weight:500;color:var(--ink-2);text-align:left;padding:12px 16px 12px 0;border-bottom:1px solid var(--ink);white-space:nowrap}
.tbl td{padding:16px 16px 16px 0;border-bottom:1px solid var(--rule);vertical-align:top;font-size:1rem}
.tbl tr[data-open]{cursor:pointer}
.tbl tr[data-open]:hover td{background:var(--hover)}
.tbl .place{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;align-items:start}
.tbl .place.nopic{grid-template-columns:minmax(0,1fr)}
.tbl .place .img{width:96px;aspect-ratio:4/3;overflow:hidden}
.tbl .place .img img,.tbl .place .img .ph{width:100%;height:100%;object-fit:cover}
.tbl .name{font-size:1.1875rem;font-weight:700;line-height:1.35}
.tbl .name .num{margin-right:8px}
.tbl .why{font-size:.9375rem;color:var(--ink-2);margin-top:4px}
.tbl .sm{display:block;font-size:.875rem;color:var(--ink-2)}
.tbl .more{color:var(--ink-2);font-size:.9375rem;white-space:nowrap}
.tbl-foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:16px;font-size:.9375rem;color:var(--ink-2)}
.three{border-top:2px solid var(--ink)}
.three > div{grid-column:span 4;padding-top:16px;display:grid;gap:16px;align-content:start}
.three > div + div{border-left:1px solid var(--rule);padding-left:32px;margin-left:-32px}
.three h2{font-size:1.5rem;font-weight:700}
.lines{list-style:none;margin:0;padding:0}
.lines li{padding:12px 0;border-top:1px solid var(--rule);display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px}
.lines li:last-child{border-bottom:1px solid var(--rule)}
.lines .k{color:var(--accent);font-weight:500}
.lines b{font-weight:700}
.lines small{display:block;font-size:.9375rem;color:var(--ink-2)}
.lines button{display:block;width:100%}
.lines .drive{font-size:.9375rem;font-weight:500;color:var(--ink-2)}

/* 상세 */
.scrim{position:fixed;inset:0;background:rgba(27,26,23,.4);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--paper);z-index:41;display:flex;flex-direction:column;border-left:2px solid var(--ink)}
.d-bar{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 32px 16px;border-bottom:1px solid var(--rule);flex:none}
.d-bar span{font-size:.9375rem;font-weight:500;color:var(--ink-2)}
.d-body{overflow:auto;padding:24px 32px calc(40px + env(safe-area-inset-bottom,0px));display:grid;gap:24px;align-content:start}
.d-photo{width:100%;aspect-ratio:3/2;object-fit:cover}
.d-body h2{font-size:2.25rem;font-weight:800;letter-spacing:-.03em}
.d-why{border-left:2px solid var(--accent);padding-left:16px}
.d-why b{display:block;font-size:.875rem;font-weight:500;color:var(--accent)}
.warn{font-weight:500;color:var(--accent)}
.dl{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:24px;border-top:2px solid var(--ink)}
.dl div{padding:12px 0;border-bottom:1px solid var(--rule);min-width:0}
.dl .wide{grid-column:1/-1}
.dl dt{font-size:.875rem;font-weight:500;color:var(--ink-2)}
.dl dd{margin:2px 0 0;font-size:1rem}
.dl a{text-underline-offset:3px}
.d-actions{display:flex;gap:8px;flex-wrap:wrap}
.d-actions .btn{flex:1 1 10rem}
.src{font-size:.875rem;color:var(--ink-2)}

/* 코스 */
.c-ctrl{grid-column:1/5;display:grid;gap:24px;align-content:start}
.c-ctrl h1{font-size:2.5rem;font-weight:800;letter-spacing:-.03em}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fld{display:grid;gap:4px}
.fld span{font-size:.875rem;font-weight:500;color:var(--ink-2)}
.fld input{font:inherit;font-size:1rem;height:48px;padding:0 12px;border:1px solid var(--ink);border-radius:2px;background:transparent;min-width:0}
.opt{display:flex;gap:12px;align-items:center;font-size:1rem}
.opt input{width:20px;height:20px;accent-color:var(--ink)}
.c-rules{border-top:1px solid var(--rule);padding-top:16px;display:grid;gap:4px;font-size:.9375rem;color:var(--ink-2)}
.c-rules b{color:var(--ink);font-weight:500}
.c-out{grid-column:5/13}
.c-out .sec-h p{font-size:.9375rem;color:var(--ink-2)}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:0 32px;margin-top:16px}
.day{display:grid;gap:8px;align-content:start;padding-bottom:32px}
.day .dn{font-size:.875rem;font-weight:500;color:var(--accent)}
.day h3{font-size:1.375rem;font-weight:700}
.day .stay{font-size:.9375rem;color:var(--ink-2)}
.day .hol{font-size:.9375rem;font-weight:500;color:var(--accent)}
.tl{list-style:none;margin:8px 0 0;padding:0}
.tl li > *{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;padding:12px 0;border-top:1px solid var(--rule);width:100%}
.tl li:last-child > *{border-bottom:1px solid var(--rule)}
.tl time{font-size:.9375rem;font-weight:500;color:var(--ink-2)}
.tl b{display:block;font-weight:700;font-size:1rem}
.tl small{display:block;font-size:.875rem;color:var(--ink-2)}
.tl .k{font-weight:500;color:var(--accent);margin-right:6px}
.status{font-size:.9375rem;color:var(--ink-2);min-height:1.5em}
.csum{margin:8px 0 32px;border-top:2px solid var(--ink)}
.dstat{font-size:.9375rem;color:var(--ink-2)}
.dstat b{color:var(--ink);font-weight:700}

/* 출처 */
.cr-info{grid-column:1/5;display:grid;gap:16px;align-content:start;font-size:1rem;color:var(--ink-2)}
.cr-info h1{font-size:2.5rem;font-weight:800;letter-spacing:-.03em;color:var(--ink)}
.cr-info b{color:var(--ink);font-weight:500}
.cr-main{grid-column:5/13;display:grid;gap:56px}
.cr-sec{border-top:2px solid var(--ink);padding-top:16px;display:grid;gap:12px;color:var(--ink-2)}
.cr-sec h2{font-size:1.5rem;font-weight:700;color:var(--ink)}
.cr-list{columns:2 20rem;column-gap:32px;margin-top:8px}
.cr-list p{break-inside:avoid;padding:12px 0;border-bottom:1px solid var(--rule);font-size:.9375rem;color:var(--ink-2)}
.cr-list p b{display:block;color:var(--ink);font-weight:700}

/* 반응형 */
@media (max-width:1200px){
  .idx{grid-template-columns:repeat(4,minmax(0,1fr))}
  .hero-l{grid-column:1/6}.hero-map{grid-column:6/13}
  .c-ctrl,.c-out,.cr-info,.cr-main{grid-column:1/-1}
  .cr-main{margin-top:40px}
  .c-out{margin-top:40px}
}
@media (max-width:860px){
  .hero .wrap{min-height:0;padding-block:32px}
  .hero-l,.hero-map{grid-column:1/-1}
  .hero-map{order:-1;margin-bottom:24px}
  .pick{min-height:0}
  .map-cap{text-align:left}
  .zone .zl{font-size:22px}.zone .zn{font-size:15px}
  .cover{height:52vh}
  .nav{margin-left:0;order:3;width:100%}
  .sum{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sum div:nth-child(3){padding-left:0;border-left:0}
  .sum div:nth-child(n+3){border-top:1px solid var(--rule)}
  .three > div{grid-column:1/-1}
  .three > div + div{border-left:0;padding-left:0;margin-left:0;border-top:1px solid var(--ink);margin-top:24px}
  /* 표 → 세로 목록 */
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl tr{border-bottom:1px solid var(--rule);padding:16px 0}
  .tbl td{border:0;padding:2px 0}
  .tbl td[data-l]::before{content:attr(data-l) " ";font-size:.875rem;font-weight:500;color:var(--ink-2);margin-right:4px}
  .tbl td.first{padding-bottom:8px}
  .tbl .more{display:none}
  main{padding-block:32px 56px}
}
@media (max-width:560px){
  .brand small{display:none}
  .idx{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dl{grid-template-columns:1fr}
  .dates{grid-template-columns:1fr}
  .d-body,.d-bar{padding-inline:16px}
  .tbl .place{grid-template-columns:72px minmax(0,1fr)}
  .tbl .place .img{width:72px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const R = window.REGIONS;

  if (!sampleFn) {
    course.result = makeCourse(Date.now() % 1e9); course.source = "rule";
    course.msg = sampleFn === null ? "맞춤 코스는 claude.ai에 게시된 페이지를 Claude에 로그인한 상태로 열었을 때 만들 수 있습니다. 대신 기준에 맞춘 코스를 새로 보여 드립니다." : "준비 중입니다. 잠시 후 다시 눌러 주세요.";
    return render();
  }
  aiCtl?.abort(); aiCtl = new AbortController();
  $("#btnAI").disabled = true; $("#cStatus").textContent = "조건에 맞춰 코스를 만들고 있습니다. 30초에서 1분 정도 걸립니다.";
  const n = course.nights + 1;
  const dates = Array.from({ length: n }, (_, i) => dayInfo(i)).map((d, i) => d.date ? `${i + 1}일째=${d.date} ${DOW[d.dow]}요일${d.hol ? " 공휴일(" + d.hol + ")" : ""}` : "").filter(Boolean).join(", ");
  const catalog = R.map(r => `[${r.id}] ${r.name}\n 명소: ${r.spots.filter(s => s.w !== "hard").map(s => `${s.id}=${s.n}/${s.w}/${s.io}`).join("; ")}\n 식당: ${r.foods.map(f => `${f.id}=${f.n}/${f.m}/${f.hours}`).join("; ")}\n 카페: ${r.rest.map(c => `${c.id}=${c.n}`).join("; ")}`).join("\n");
  const prompt = `부모님을 모시고 가는 제주 ${course.nights}박 ${n}일 여행 코스를 짜 주세요. ${dates}
규칙: 아래 목록의 id만 쓰세요. 섬 둘레 순서는 ${RING.join(" → ")}이고, 하루에 이웃한 지역 1~2곳만 한 방향으로 이동하세요. 첫날 11:00 공항 도착, 마지막 날 17:00 공항. 하루 명소 2~3곳, 점심·저녁 1곳씩(마지막 날 저녁 제외), 카페 1곳. 중복 금지. 영업시간과 휴무 요일을 지키세요.${course.easy ? " 걷기 mid는 하루 1곳 이하." : ""}${course.rain ? " 비 오는 날이라 실내 우선." : ""} 변화 번호 ${Math.floor(Math.random() * 1e6)}에 맞춰 매번 다른 조합으로.
목록:
${catalog}
JSON만: {"days":[{"regions":["aewol"],"stay":"aewol","note":"한 줄 설명","items":[{"t":"09:30","id":"handam"}]}]} 마지막 날 stay는 null, 공항은 items에 넣지 마세요.`;
  try {
    const out = await sampleFn.json(prompt, { signal: aiCtl.signal, cache: false });
    const days = (out?.days || []).slice(0, n).map((d, i) => {
      const items = (d.items || []).filter(it => BYID[String(it.id)]).map(it => ({ t: String(it.t || "").slice(0, 5), id: String(it.id) }));
      items.sort((a, b) => a.t.localeCompare(b.t));
      items.forEach(it => { const p = BYID[it.id]; if (kindOf(p) === "food") { const h = parseInt(it.t); it.note = h < 10 ? "아침" : h < 16 ? "점심" : "저녁"; } });
      const regs = (d.regions || []).filter(x => RBY[x]);
      return timeify({ regions: regs.length ? regs : [...new Set(items.map(x => BYID[x.id].region))], stay: RBY[d.stay] ? d.stay : null, note: String(d.note || "").slice(0, 50), items, ...dayInfo(i) }, i === 0, i === n - 1);
    });
    if (days.length !== n || days.some(d => d.items.filter(x => x.id).length < 2 || (d.stats && d.stats.drive > 240))) throw { code: "bad_shape" };
    course.result = { days }; course.source = "ai"; course.msg = "조건에 맞춘 코스입니다. 이 안내서에 확인된 장소만 사용했습니다."; render();
  } catch (e) {
    const b = $("#btnAI"); if (b) b.disabled = false;
    if (e.code === "cancelled") return;
    course.msg = ["not_granted", "sampling_disabled", "capability_disabled", "not_declared"].includes(e.code) ? "맞춤 코스 기능이 허용되지 않아 기준 코스를 보여 드립니다."
      : e.code === "rate_limited" ? "요청이 많습니다. 잠시 후 다시 눌러 주세요." : "만든 코스가 기준에 맞지 않았습니다. 다시 눌러 주세요.";
    $("#cStatus").textContent = course.msg;
  }
}
function syncDates() {
  course.msg = "";
  if (!(course.from && course.to)) return;
  const n = Math.round((new Date(course.to + "T00:00") - new Date(course.from + "T00:00")) / 864e5);
  if (n < 1) { course.msg = "오는 날은 가는 날보다 뒤여야 합니다."; return; }
  if (n > 4) { course.nights = 4; course.msg = "4박 5일까지 추천합니다. 앞의 5일 일정을 보여 드립니다."; return; }
  course.nights = n;
}

/* ---------- 출처 ---------- */
function viewCredits() {
  return `<section class="g">
    <div class="cr-info">
      <span class="kicker">부록</span>
      <h1>사진·정보 출처</h1>
      <p>이 안내서에 쓴 사진, 장소 정보, 그래픽과 서체의 출처입니다.</p>
      <p><button class="link" type="button" data-go="home">← 지역 선택으로 돌아가기</button></p>
    </div>
    <div class="cr-main">
      <section class="cr-sec"><h2>1. 사진과 라이선스</h2>
        <p>Wikimedia Commons의 퍼블릭 도메인·CC 라이선스 사진만 사용했습니다. 모두 2026년 10월 9일에 내려받았고, CC BY-SA 사진은 같은 라이선스 조건을 따릅니다. 포털 지도·블로그·SNS 사진은 사용하지 않았습니다. 지역 대표 사진은 아래 장소 사진의 고해상도 판입니다.</p>
        <div class="cr-list">${(window.CREDITS || []).map(c => `<p><b>${esc(c.name)}</b>Image by ${esc(c.artist || "작가 미상")} / Wikimedia Commons · ${esc(c.lic)}<br><a href="${esc(c.url)}" target="_blank" rel="noopener">원본 페이지</a> · 2026.10.09 내려받음</p>`).join("")}</div>
      </section>
      <section class="cr-sec"><h2>2. 장소 정보</h2>
        <p>주소, 전화, 평점, 영업시간, 브레이크 타임, 휴무, 주차, 가격, 홈페이지, 최근 후기 날짜는 2026년 10월 9일 카카오맵 장소 페이지에서 확인했습니다.</p>
        <p>대기는 후기 수와 ‘웨이팅’ 언급으로 추정한 값입니다. 걷는 거리·경사·이동 시간은 대략값이며, 이동 시간은 직선거리를 도로 거리로 환산해 계산했습니다.</p>
        <p>공휴일은 한국 법정 공휴일과 대체공휴일(2026–2027) 기준입니다. 방문 전 운영 여부를 꼭 확인하세요.</p>
      </section>
      <section class="cr-sec"><h2>3. 그래픽과 서체</h2>
        <p>로고와 제주 지도는 이 안내서를 위해 직접 그렸습니다. 지도의 지역 경계는 안내를 위한 구분이며 행정구역과 다릅니다.</p>
        <p>서체: Pretendard (SIL Open Font License 1.1)</p>
      </section>
    </div>
  </section>`;
}

/* ---------- 라우팅 ---------- */
let route = "home";
function render() {
  const scr = $("#screen");
  if (route === "course") { if (!course.result) course.result = makeCourse(Date.now() % 1e9); scr.innerHTML = viewCourse(); }
  else if (route === "credits") scr.innerHTML = viewCredits();
  else if (RBY[route]) scr.innerHTML = viewRegion(route);
  else scr.innerHTML = viewHome();
  scr.classList.toggle("full", route === "home" || !!RBY[route]);
  scr.classList.toggle("wrap", !(route === "home" || !!RBY[route]));
  document.querySelectorAll(".nav button").forEach(b => b.setAttribute("aria-current", String(b.dataset.go === route || (b.dataset.go === "home" && (route === "home" || !!RBY[route])))));
}
function go(r) { if (RBY[r]) pick = r; route = r; st = { cat: "all", easy: false }; closeDetail(); render(); window.scrollTo(0, 0); try { history.replaceState(null, "", "#" + r); } catch (e) {} }
const reroll = () => { aiCtl?.abort(); course.result = makeCourse(Date.now() % 1e9); course.source = "rule"; render(); };

document.addEventListener("click", e => {
  const t = e.target.closest("[data-go],[data-region],[data-open],[data-close],[data-cat],[data-easy],[data-nights],[data-copy],[data-situ],[data-pick],[data-s],#btnRoll,#btnAI");
  if (!t) return;
  if (t.dataset.close !== undefined) return closeDetail();
  if (t.dataset.copy) { const v = t.dataset.copy; try { navigator.clipboard.writeText(v).then(() => t.textContent = "복사했습니다", () => t.textContent = v); } catch (err) { t.textContent = v; } return; }
  if (t.dataset.s) { document.documentElement.classList.remove("s2", "s3"); if (t.dataset.s !== "1") document.documentElement.classList.add("s" + t.dataset.s); document.querySelectorAll("[data-s]").forEach(b => b.setAttribute("aria-pressed", String(b === t))); try { localStorage.setItem("jeju-fs", t.dataset.s); } catch (err) {} return; }
  if (t.dataset.situ !== undefined) { situ = situ === t.dataset.situ ? null : t.dataset.situ; return render(); }
  if (t.dataset.pick) { pick = t.dataset.pick; render(); if (t.closest(".idx")) document.querySelector(".hero")?.scrollIntoView({ block: "start" }); return; }
  if (t.dataset.go) { e.preventDefault(); return go(t.dataset.go); }
  if (t.dataset.region) { e.preventDefault(); return go(t.dataset.region); }
  if (t.dataset.open) return openDetail(t.dataset.open);
  if (t.dataset.cat) { st.cat = t.dataset.cat; return render(); }
  if (t.dataset.easy) { st.easy = t.dataset.easy === "1"; return render(); }
  if (t.dataset.nights) { course.nights = +t.dataset.nights; course.to = ""; course.msg = ""; return reroll(); }
  if (t.id === "btnRoll") { course.msg = ""; return reroll(); }
  if (t.id === "btnAI") return askAI();
});
document.addEventListener("change", e => {
  const id = e.target.id;
  if (id === "optEasy") course.easy = e.target.checked;
  else if (id === "optRain") course.rain = e.target.checked;
  else if (id === "dFrom" || id === "dTo") { course[id === "dFrom" ? "from" : "to"] = e.target.value; syncDates(); }
  else return;
  reroll();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") return closeDetail();
  if (e.key !== "Enter" && e.key !== " ") return;
  const g = e.target.closest?.(".zone,tr[data-open]");
  if (g) { e.preventDefault(); if (g.dataset.pick) { pick = g.dataset.pick; render(); document.querySelector(`.zone[data-pick="${pick}"]`)?.focus(); } else openDetail(g.dataset.open); }
});
try { const s = localStorage.getItem("jeju-fs"); if (s && s !== "1") document.querySelector(`[data-s="${s}"]`)?.click(); } catch (e) {}
const h0 = (location.hash || "").slice(1);
route = (h0 === "course" || h0 === "credits" || RBY[h0]) ? h0 : "home";
render();
(async () => { try { sampleFn = window.claude ? await window.claude.use("sample") : null; } catch (e) { sampleFn = null; } })();
</script>
