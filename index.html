<title>천천히, 제주</title>
<meta name="description" content="부모님과 함께 고르는 제주. 걷는 거리와 이동 시간으로 고른 지역·식당·코스">
<style>
/* 천천히, 제주 — 디자인 체계
   폭: 콘텐츠 최대 1280px, 좌우 여백 데스크톱 60px. 그리드: 12열, 열 간격 24px.
   색: 아이보리(바탕) · 네이비 블랙(글자·어두운 패널) · 감귤(선택·주요 버튼) · 회녹(보조 글자).
   선: 기본 1px, 활성만 2px. 어두운 패널은 화면마다 오른쪽 위 핵심 모듈 하나에만 쓴다.
   글자: 쪽 제목 48px/700 · 단락 제목 28px/700 · 본문 18px/400 · 보조 15px/500. */
@font-face{font-family:"Pretendard Variable";font-weight:45 920;font-style:normal;font-display:swap;
  src:url("PretendardVariable.woff2") format("woff2-variations"),url("PretendardVariable.woff2") format("woff2")}
:root{
  color-scheme:light;
  --bg:#F5F2EA;      /* 따뜻한 아이보리 */
  --navy:#141B24;    /* 네이비 블랙 */
  --orange:#D9692A;  /* 감귤 */
  --sage:#5B6862;    /* 회녹 — 보조 글자 */
  --line:rgba(20,27,36,.16);
  --line-dk:rgba(245,242,234,.22);
  --on-dk:#F5F2EA;
  --on-dk2:rgba(245,242,234,.74);
  /* 지역·상세 화면이 쓰는 이름 */
  --ivory:var(--bg); --paper:var(--bg); --char:var(--navy); --ink-2:var(--sage); --rule:var(--line); --accent:var(--orange); --accent-ink:#A9501C;
  --font:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --gut:clamp(20px,4.4vw,60px);
}
html{font-size:18px}
html.s2{font-size:20px} html.s3{font-size:22px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--navy);font-family:var(--font);font-weight:400;font-size:1rem;line-height:1.7;letter-spacing:-.005em;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.025em;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:left}
a{color:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--orange);outline-offset:3px}
.tnum{font-variant-numeric:tabular-nums}
.wrap{max-width:calc(1280px + 2 * var(--gut));margin:0 auto;padding-inline:var(--gut)}
.narrow{}
.g{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px}

/* 공통 글자 */
.kicker{font-size:.85rem;font-weight:500;color:var(--sage)}
.page-h{font-size:clamp(2.2rem,3.2vw,2.67rem);font-weight:700;letter-spacing:-.035em;line-height:1.22}
.page-h span{display:block}
.lead{font-size:1.1rem;color:var(--sage);max-width:24em}
.sec-t{font-size:1.56rem;font-weight:700;letter-spacing:-.025em}
.meta{font-size:.85rem;font-weight:500;color:var(--sage)}

/* 공통 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 26px;border:1px solid var(--navy);border-radius:2px;font-weight:600;font-size:1rem;text-decoration:none;white-space:nowrap;background:transparent;color:var(--navy)}
.btn:hover{background:var(--navy);color:var(--bg)}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.primary:hover{filter:brightness(.93);background:var(--orange);color:#fff}
.btn.solid{background:var(--navy);color:var(--bg)}
.btn:disabled{opacity:.55;cursor:wait}
.dk .btn{border-color:var(--line-dk);color:var(--on-dk)}
.dk .btn:hover{background:rgba(245,242,234,.08);color:var(--on-dk)}
.dk .btn.primary{border-color:var(--orange);color:#fff}
.link{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px;text-decoration-color:var(--line);min-height:44px;display:inline-flex;align-items:center}
.link:hover{text-decoration-color:var(--navy)}
.tabs{display:flex;gap:0 28px;flex-wrap:wrap}
.tabs button{min-height:44px;font-size:1rem;font-weight:500;color:var(--sage);border-bottom:2px solid transparent}
.tabs button[aria-pressed="true"]{color:var(--navy);border-bottom-color:var(--orange)}
.warn{color:var(--accent-ink);font-weight:600}
.dk{background:var(--navy);color:var(--on-dk)}

/* 머리 — 세 화면 공통 */
.mast{border-bottom:1px solid var(--line)}
.mast .wrap{display:flex;align-items:center;gap:32px;height:76px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;min-height:44px;margin-right:auto}
.brand svg{width:30px;height:30px;flex:none}
.brand b{font-size:1.15rem;font-weight:700;letter-spacing:-.03em;white-space:nowrap}
.nav{display:flex;gap:28px}
.nav button{min-height:44px;font-size:1rem;font-weight:500;color:var(--sage);border-bottom:2px solid transparent;white-space:nowrap}
.nav button[aria-current="true"]{color:var(--navy);border-bottom-color:var(--orange)}
.sizes{display:flex;align-items:center;gap:10px;padding-left:28px;border-left:1px solid var(--line);height:36px}
.sizes > span{font-size:.8rem;font-weight:500;color:var(--sage);white-space:nowrap}
.sizes .seg{display:flex;border:1px solid var(--line);border-radius:2px}
.sizes button{min-height:40px;padding:0 10px;font-weight:600;color:var(--sage);line-height:1;white-space:nowrap}
.sizes button + button{border-left:1px solid var(--line)}
.sizes button[aria-pressed="true"]{background:var(--navy);color:var(--bg)}
.sizes button[data-s="1"]{font-size:14px}.sizes button[data-s="2"]{font-size:16.5px}.sizes button[data-s="3"]{font-size:19px}
main{min-height:60vh}

/* 바닥 — 세 화면 공통 */
.foot{margin-top:112px;border-top:1px solid var(--line)}
.foot .g{padding-block:56px 72px;row-gap:28px}
.foot .f-brand{grid-column:1/5;display:grid;gap:4px;align-content:start}
.foot .f-brand b{font-size:1.1rem;font-weight:700}
.foot .f-brand span,.foot .f-info p{font-size:.85rem;color:var(--sage)}
.foot .f-nav{grid-column:5/9;display:grid;gap:2px;align-content:start;justify-items:start}
.foot .f-nav button{min-height:36px;font-size:.95rem;font-weight:500}
.foot .f-nav button:hover{text-decoration:underline;text-underline-offset:4px}
.foot .f-info{grid-column:9/13;display:grid;gap:4px;align-content:start}
.foot .f-info b{font-size:.85rem;font-weight:600}
.foot .f-info .link{min-height:36px;font-size:.9rem;justify-self:start;margin-top:6px}

/* 화면 첫 줄: 왼쪽 제목, 오른쪽 어두운 모듈 — 세 화면 공통 */
.top{padding-block:56px 0;align-items:start;row-gap:32px}
.top-copy{grid-column:1/6;display:grid;gap:22px;align-content:start;align-self:center;padding-bottom:24px}
.top-copy .btn{justify-self:start;margin-top:6px}
.top-mod{grid-column:6/13;min-width:0}

/* 요약 띠 — 코스·여행 준비 공통 */
.sumrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:24px;margin:48px 0 0;border-top:1px solid var(--navy)}
.sumrow div{padding:18px 0 4px}
.sumrow dt{font-size:.85rem;font-weight:500;color:var(--sage)}
.sumrow dd{margin:4px 0 0;font-size:1.5rem;font-weight:700;letter-spacing:-.02em;line-height:1.3}
.sumrow dd span{display:block;font-size:.85rem;font-weight:500;color:var(--sage);letter-spacing:0;margin-top:4px}

/* 단락 머리 */
.blk{margin-top:72px}
.blk-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px 24px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--navy)}
.blk-h p{font-size:.95rem;color:var(--sage)}

/* ---------- 홈 ---------- */
.media{display:grid}
.mapbox{padding:36px 32px 20px}
.mapbox svg{width:100%;height:auto;display:block}
.zone{cursor:pointer}
.zone path{fill:rgba(245,242,234,.05);stroke:rgba(245,242,234,.45);stroke-width:1.2;transition:fill .2s}
.zone:hover path{fill:rgba(245,242,234,.14)}
.zone.on path{fill:var(--orange)}
.zone text{pointer-events:none;fill:var(--on-dk);font-family:var(--font);font-size:24px;font-weight:500;letter-spacing:-.02em}
.zone.on text{font-weight:700}
.zone:focus{outline:none}
.zone:focus-visible path{stroke:var(--on-dk);stroke-width:3}
.coast{fill:none;stroke:var(--on-dk);stroke-width:2;pointer-events:none}
.sel{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:end;gap:24px;margin:0 32px;padding:20px 0 28px;border-top:1px solid var(--line-dk)}
.sel .no{display:block;font-size:.85rem;font-weight:500;color:var(--on-dk2)}
.sel h2{font-size:1.56rem;font-weight:700;letter-spacing:-.025em;color:var(--on-dk)}
.sel .drv{display:grid;gap:2px}
.sel .drv span{font-size:.85rem;font-weight:500;color:var(--on-dk2)}
.sel .drv b{font-size:1.15rem;font-weight:700}
.sel .btn{min-height:46px;padding:0 20px}
.idx{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:24px;list-style:none;margin:0;padding:0}
.idx li{border-bottom:1px solid var(--line)}
.idx button{width:100%;display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:baseline;gap:8px;min-height:64px;padding-top:18px;border-bottom:2px solid transparent;margin-bottom:-1px}
.idx .n{font-size:.95rem;font-weight:500;color:var(--sage)}
.idx b{font-size:1.05rem;font-weight:600;white-space:nowrap}
.idx small{font-size:.85rem;color:var(--sage);white-space:nowrap}
.idx button:hover b{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}
.idx button[aria-pressed="true"]{border-bottom-color:var(--orange)}
.idx button[aria-pressed="true"] b,.idx button[aria-pressed="true"] .n{color:var(--accent-ink);font-weight:700}
.prev2 > div{grid-column:span 6}

/* 체크리스트 — 홈·여행 준비 공통 */
.ck-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-block:20px 10px}
.ck-h h3{font-size:1.22rem;font-weight:700}
.ck-h .prog{font-size:1rem;color:var(--sage)}
.ck-h .prog b{color:var(--accent-ink);font-weight:700}
.bar2{height:2px;background:var(--line)}
.bar2 i{display:block;height:100%;background:var(--orange);transition:width .3s}
.ck{list-style:none;margin:0;padding:0}
.ck li{border-bottom:1px solid var(--line)}
.ck label{display:grid;grid-template-columns:36px 26px minmax(0,1fr);gap:14px;align-items:center;min-height:66px;padding-block:12px;cursor:pointer;font-size:1.05rem;line-height:1.5}
.ck .no{font-size:1rem;color:var(--sage);font-weight:500}
.ck input{appearance:none;-webkit-appearance:none;width:24px;height:24px;margin:0;border:1.5px solid var(--navy);border-radius:2px;display:grid;place-items:center;cursor:pointer;background:transparent}
.ck input:checked{background:var(--orange);border-color:var(--orange)}
.ck input:checked::after{content:"";width:11px;height:6px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.ck input:checked + span{color:var(--sage)}
.ck-more{margin-top:8px}

/* ---------- 코스 ---------- */
.form{padding:32px 32px 28px;display:grid;gap:24px}
.form .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fld{display:grid;gap:6px;cursor:pointer}
.fld span{font-size:.85rem;font-weight:500;color:var(--sage)}
.dk .fld span{color:var(--on-dk2)}
.fld input{font:inherit;font-size:1rem;height:54px;width:100%;padding:0 14px;border:1px solid var(--navy);border-radius:2px;background:transparent;color:inherit;min-width:0;cursor:pointer}
.dk .fld input{border-color:var(--line-dk);color-scheme:dark}
.dk .fld input:hover,.dk .fld input:focus{border-color:var(--on-dk)}
.form .or{display:grid;gap:8px;padding-top:20px;border-top:1px solid var(--line-dk)}
.form .or > span{font-size:.85rem;font-weight:500;color:var(--on-dk2)}
.segs{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line-dk);border-radius:2px}
.segs button{min-height:46px;text-align:center;font-weight:500;color:var(--on-dk2)}
.segs button + button{border-left:1px solid var(--line-dk)}
.segs button[aria-pressed="true"]{background:var(--on-dk);color:var(--navy);font-weight:600}
.segs.auto button[aria-pressed="true"]{background:transparent;color:var(--on-dk);box-shadow:inset 0 -2px 0 var(--orange)}
.opts{display:grid;gap:2px;padding-top:20px;border-top:1px solid var(--line-dk)}
.opt{display:flex;gap:14px;align-items:center;font-size:1rem;min-height:46px;cursor:pointer}
.opt input{appearance:none;-webkit-appearance:none;width:24px;height:24px;margin:0;border:1.5px solid currentColor;border-radius:2px;display:grid;place-items:center;cursor:pointer;flex:none}
.opt input:checked{background:var(--orange);border-color:var(--orange)}
.opt input:checked::after{content:"";width:11px;height:6px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.acts{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding-top:20px;border-top:1px solid var(--line-dk)}
.acts .note{font-size:.85rem;color:var(--on-dk2);flex-basis:100%}
.status{font-size:.95rem;color:var(--on-dk2)}
.status:empty{display:none}
.days{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:24px;row-gap:48px;margin-top:28px}
.day{display:grid;grid-row:span 2;grid-template-rows:subgrid;row-gap:0}
.day-h{display:grid;gap:6px;align-content:start;padding-bottom:16px}
.day .dn{font-size:.85rem;font-weight:600;color:var(--accent-ink)}
.day h3{font-size:1.33rem;font-weight:700}
.day .stay,.day .dstat{font-size:.9rem;color:var(--sage)}
.day .dstat b{color:var(--navy)}
.day .hol{font-size:.9rem;font-weight:600;color:var(--accent-ink)}
.tl{list-style:none;margin:0;padding:0;border-top:1px solid var(--navy);align-self:start}
.tl li > *{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;padding:13px 0;border-bottom:1px solid var(--line);width:100%}
.tl time{font-size:.95rem;font-weight:500;color:var(--sage)}
.tl b{display:block;font-weight:700;font-size:1rem}
.tl small{display:block;font-size:.85rem;color:var(--sage)}
.tl .k{font-weight:600;color:var(--accent-ink);margin-right:8px}

/* ---------- 여행 준비 ---------- */
.prog-mod{padding:32px;display:grid;gap:22px}
.prog-mod .big{font-size:3rem;font-weight:700;letter-spacing:-.03em;line-height:1}
.prog-mod .big b{color:var(--orange);font-weight:700}
.prog-mod .big small{font-size:1rem;font-weight:500;color:var(--on-dk2);margin-left:10px;letter-spacing:0}
.prog-mod .bar2{background:var(--line-dk)}
.prog-mod .trio{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin:0}
.prog-mod .trio dt{font-size:.85rem;color:var(--on-dk2)}
.prog-mod .trio dd{margin:2px 0 0;font-size:1.1rem;font-weight:600}
.prog-mod .acts{padding-top:20px}
.cols3 > div{grid-column:span 4}

/* ---------- 지역 ---------- */
.r-bar{display:flex;justify-content:space-between;gap:8px 24px;flex-wrap:wrap;align-items:center;font-size:.95rem;color:var(--sage);padding-block:8px 12px}
.r-bar nav{display:flex;gap:24px}
.cover-frame{max-width:calc(1280px + 2 * var(--gut));margin:0 auto;padding-inline:var(--gut)}
.cover{position:relative;height:clamp(380px,52vw,560px);overflow:hidden;background:var(--navy)}
.cover img{width:100%;height:100%;object-fit:cover}
.cover::after{content:"";position:absolute;left:0;right:0;bottom:0;height:66%;background:linear-gradient(to top,rgba(0,0,0,.62) 0%,rgba(0,0,0,.28) 45%,rgba(0,0,0,.03) 78%,transparent 100%)}
.cover::before{content:"";position:absolute;inset:0;background:linear-gradient(to right,rgba(0,0,0,.3) 0%,rgba(0,0,0,.1) 45%,transparent 70%)}
.cover .in{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:0 clamp(20px,4vw,56px) 44px;color:var(--on-dk);display:grid;gap:12px}
.cover .no{font-size:1rem;font-weight:500}
.cover h1{font-size:clamp(2.6rem,4.2vw,4.2rem);font-weight:800;letter-spacing:-.045em;line-height:1.08}
.cover p{font-size:1.1rem;max-width:38em;line-height:1.6}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;margin:48px 0 80px}
.strip div{border-top:2px solid var(--navy);padding-top:16px}
.strip dt{font-size:.9rem;color:var(--sage)}
.strip dd{margin:6px 0 0;font-size:clamp(1.35rem,1.7vw,1.6rem);font-weight:700;line-height:1.3;letter-spacing:-.02em}
.strip dd span{display:block;font-size:.95rem;font-weight:400;color:var(--sage);margin-top:6px;letter-spacing:0;line-height:1.5}
.sec{margin-bottom:80px}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:12px 24px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--navy)}
.sec-h h2{font-size:clamp(2rem,2.4vw,2.4rem);font-weight:700}
.sec-h p{font-size:.95rem;color:var(--sage)}
.rows{list-style:none;margin:0;padding:0}
.rows > li{border-bottom:1px solid var(--line)}
.rows .row{width:100%;display:grid;grid-template-columns:56px minmax(0,1fr) 12rem 14rem 6rem;gap:24px;align-items:start;padding-block:20px}
.rows .row:hover .nm{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}
.rows .k{font-size:.95rem;font-weight:600;color:var(--accent-ink);padding-top:4px}
.rows .nm{font-size:1.3rem;font-weight:700;line-height:1.35;letter-spacing:-.02em}
.rows .cat{display:block;font-size:.85rem;color:var(--sage);font-weight:500;margin-bottom:2px}
.rows .why{font-size:1rem;color:var(--sage);margin-top:6px}
.rows .v{font-size:1rem;font-weight:600;line-height:1.45}
.rows .v small{display:block;font-size:.9rem;font-weight:400;color:var(--sage);margin-top:2px}
.rows .v .lab{display:block;font-size:.8rem;font-weight:500;color:var(--sage);margin-bottom:2px}
.rows .go{font-size:.95rem;font-weight:600;padding-top:4px;text-align:right;white-space:nowrap}
.hi{color:var(--accent-ink)}
.rows .row.fr{grid-template-columns:10rem minmax(0,1fr) 12rem 12rem 6rem}
.rows .row.fr .k{font-size:1.05rem;font-weight:700}
.rows .k small{display:block;font-size:.85rem;font-weight:400;color:var(--sage);margin-top:2px}
.empty{padding-block:24px;color:var(--sage)}
.three{column-gap:24px}
.three > div{grid-column:span 4;border-top:1px solid var(--navy);padding-top:18px;display:grid;gap:14px;align-content:start}
.three h2{font-size:1.56rem;font-weight:700}
.lines{list-style:none;margin:0;padding:0}
.lines li{padding:14px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;font-size:1rem}
.lines.named li{grid-template-columns:minmax(0,1fr);gap:2px}
.lines .lab{display:block;font-size:.85rem;font-weight:600;color:var(--accent-ink)}
.lines .k{color:var(--accent-ink);font-weight:600}
.lines b{font-weight:700}
.lines small{display:block;font-size:1rem;color:var(--sage)}
.lines button.item{display:block;width:100%}
.lines .drive{display:block;font-size:.9rem;color:var(--sage);margin-top:4px}

/* ---------- 상세 창 ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,27,36,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(660px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column}
.d-bar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:calc(env(safe-area-inset-top,0px) + 14px) 36px 14px;border-bottom:1px solid var(--line);flex:none}
.d-bar span{font-size:.95rem;color:var(--sage)}
.d-body{overflow:auto;padding:28px 36px calc(48px + env(safe-area-inset-bottom,0px));display:grid;gap:24px;align-content:start}
.d-photo{width:100%;aspect-ratio:3/2;object-fit:cover}
.d-body h2{font-size:2.3rem;font-weight:800;letter-spacing:-.035em}
.d-why{border-left:2px solid var(--orange);padding-left:18px}
.d-why b{display:block;font-size:.85rem;font-weight:600;color:var(--accent-ink)}
.dl{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px;border-top:1px solid var(--navy)}
.dl div{padding:12px 0;border-bottom:1px solid var(--line);min-width:0}
.dl .wide{grid-column:1/-1}
.dl dt{font-size:.85rem;color:var(--sage)}
.dl dd{margin:2px 0 0;font-size:1rem}
.dl a{text-underline-offset:3px}
.d-actions{display:flex;gap:10px;flex-wrap:wrap}
.d-actions .btn{flex:1 1 11rem;padding:0 16px}
.d-tel{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;font-size:1.05rem;margin-top:-8px}
.d-tel b{font-size:1.2rem;font-weight:700;user-select:all}
.src{font-size:.85rem;color:var(--sage)}

/* ---------- 출처 ---------- */
.cr{padding-top:56px}
.cr-info{grid-column:1/5;display:grid;gap:16px;align-content:start;color:var(--sage)}
.cr-info h1{color:var(--navy)}
.cr-main{grid-column:5/13;display:grid;gap:64px}
.cr-sec{border-top:1px solid var(--navy);padding-top:8px;display:grid;gap:12px;color:var(--sage)}
.cr-list{columns:2 20rem;column-gap:24px}
.cr-list p{break-inside:avoid;padding:12px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.cr-list b{display:block;color:var(--navy);font-weight:600;font-size:1rem}

/* ---------- 반응형 ---------- */
@media (max-width:1180px){
  .idx{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rows .row{grid-template-columns:48px minmax(0,1fr) 11rem 12rem}
  .rows .row.fr{grid-template-columns:8rem minmax(0,1fr) 11rem 10rem}
  .rows .go{display:none}
  .top-copy,.top-mod{grid-column:1/-1}

  .cr-info,.cr-main{grid-column:1/-1}
  .cr-main{margin-top:40px}
  .days{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols3 > div{grid-column:1/-1;margin-bottom:24px}
}
@media (max-width:860px){
  .mast .wrap{height:auto;flex-wrap:wrap;padding-block:10px 0;gap:6px 16px}
  .brand{order:1}
  .sizes{order:2;border-left:0;padding-left:0}
  .sizes > span{display:none}
  .nav{order:3;width:100%;gap:24px;overflow-x:auto}
  .foot .f-brand,.foot .f-nav,.foot .f-info{grid-column:1/-1}
  .foot{margin-top:80px}
  .foot .g{padding-block:40px 56px}
  .top{padding-top:32px}
  .mapbox{padding:20px 16px 12px}
  .sel{grid-template-columns:1fr auto;margin:0 20px}
  .sel .btn{grid-column:1/-1;justify-content:center}
  .zone text{font-size:40px}
  .idx{grid-template-columns:1fr 1fr}
  .prev2 > div{grid-column:1/-1}
  .sumrow,.strip{grid-template-columns:1fr 1fr}
  .days{grid-template-columns:1fr;row-gap:40px}
  .day{grid-row:auto;grid-template-rows:auto}
  .three > div{grid-column:1/-1;margin-bottom:32px}
  .rows .row,.rows .row.fr{grid-template-columns:40px minmax(0,1fr);gap:6px 16px;padding-block:20px}
  .rows .row.fr .k,.rows .row.fr > span:nth-child(2),.rows .row.fr .v{grid-column:1/-1}
  .rows .row.fr .k small{display:inline;margin-left:8px}

}
@media (max-width:600px){
  .idx{grid-template-columns:1fr}
  html{font-size:17px}

  .d-body,.d-bar{padding-inline:20px}

}

<script>
const R = window.REGIONS;
const BYID = {};
R.forEach((r, i) => { r.no = String(i + 1).padStart(2, "0"); [...r.spots, ...r.foods, ...r.rest].forEach(p => { p.region = r.id; BYID[p.id] = p; }); });
const RBY = Object.fromEntries(R.map(r => [r.id, r]));
R.forEach(r => r.spots.forEach(s => { s.slopeYN = /^없음/.test(s.slope) ? "없음" : /계단|경사|오르막|언덕|완만/.test(s.slope) ? "있음" : "없음"; }));
const parkShort = t => { const x = String(t || "").replace(/\s*\(.*\)$/, "").replace(/^주차장\s*→\s*입구\s*/, "").replace(/^주차장\s*→\s*/, "").replace(/^(해변 |공영 |시장 공영 )?주차장 바로 앞/, "바로 앞"); return /^(약|바로)/.test(x) ? "입구까지 " + x : x; };
const CAT = { all: "전체", soup: "국·탕·죽", noodle: "국수", sea: "생선·해산물", meat: "고기" };
const TIER = { 1: "1순위", 2: "2순위", 3: "3순위" };
const TIER_DESC = { 1: "기다려도 갈 만한 집", 2: "비슷한 맛, 더 짧은 대기", 3: "믿을 만한 동네 식당" };
const WALK = { easy: "적음", mid: "보통", hard: "많음" };
const COVER_CREDIT = { jejusi: "yongduam", aewol: "hyeopjae", andeok: "yongmeori", jungmun: "jusang", seogwipo: "cheonjiyeon", namwon: "pyoseon", seongsan: "seongsan", gujwa: "hamdeok" };
const cover = r => `img/cover_${r.id}.jpg`;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const creditOf = id => { const c = (window.CREDITS || []).find(x => x.id === id); return c ? `사진: ${c.artist} / Wikimedia Commons, ${c.lic}` : ""; };
const parts = h => String(h || "").split(" · ");
const brkOf = h => (parts(h).find(x => x.startsWith("쉬는 시간")) || "").replace("쉬는 시간 ", "");
const offOf = h => parts(h).find(x => x.endsWith("휴무")) || "";
const openOf = h => parts(h).filter(x => !x.startsWith("쉬는 시간") && !x.endsWith("휴무")).join(" · ");
const waitTxt = f => f.waitMin ? `${f.wait} · 후기상 약 ${f.waitMin}분` : f.wait;
function km(a, b) { const t = Math.PI / 180, x = (b.lon - a.lon) * t * Math.cos((a.lat + b.lat) / 2 * t), y = (b.lat - a.lat) * t; return Math.sqrt(x * x + y * y) * 6371; }
const driveMin = (a, b) => Math.max(5, Math.round(km(a, b) * 1.3 / 45 * 60 / 5) * 5);
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };

/* ---------- 한국 공휴일: 단기력(음력)으로 해마다 계산, 대체공휴일 포함 ---------- */
const ELECTION = { "2026-06-03": "지방선거일", "2028-04-12": "국회의원선거일" };
const HOLI_CACHE = {};
function holidays(y) {
  if (HOLI_CACHE[y]) return HOLI_CACHE[y];
  const out = {}, iso = d => d.toISOString().slice(0, 10), D = (m, d) => new Date(Date.UTC(y, m - 1, d)), sh = (d, k) => new Date(d.getTime() + k * 864e5);
  let fmt; try { fmt = new Intl.DateTimeFormat("ko-KR-u-ca-dangi", { month: "numeric", day: "numeric", timeZone: "UTC" }); } catch (e) { fmt = null; }
  const lunar = (lm, ld) => { if (!fmt) return null; for (let t = Date.UTC(y, 0, 1); t < Date.UTC(y + 1, 0, 1); t += 864e5) { const p = fmt.formatToParts(new Date(t)); const m = p.find(x => x.type === "month")?.value, d = p.find(x => x.type === "day")?.value; if (m === String(lm) && +d === ld) return new Date(t); } return null; };
  const add = (d, n) => { if (d && !out[iso(d)]) out[iso(d)] = n; };
  add(D(1, 1), "신정");
  const seol = lunar(1, 1), chu = lunar(8, 15), bud = lunar(4, 8);
  const sd = seol ? [sh(seol, -1), seol, sh(seol, 1)] : [], cd = chu ? [sh(chu, -1), chu, sh(chu, 1)] : [];
  sd.forEach((d, i) => add(d, i === 1 ? "설날" : "설날 연휴"));
  add(D(3, 1), "삼일절"); add(D(5, 5), "어린이날"); add(bud, "부처님오신날"); add(D(6, 6), "현충일"); add(D(8, 15), "광복절");
  cd.forEach((d, i) => add(d, i === 1 ? "추석" : "추석 연휴"));
  add(D(10, 3), "개천절"); add(D(10, 9), "한글날"); add(D(12, 25), "성탄절");
  Object.entries(ELECTION).forEach(([k, v]) => { if (k.startsWith(y + "-")) out[k] = v; });
  const fixed = [[3, 1], [5, 5], [8, 15], [10, 3], [10, 9], [12, 25]].map(([m, d]) => D(m, d));
  const nextFree = d => { let x = sh(d, 1); while (x.getUTCDay() === 0 || x.getUTCDay() === 6 || out[iso(x)]) x = sh(x, 1); return x; };
  const isFixed = d => fixed.some(f => iso(f) === iso(d)) || (bud && iso(bud) === iso(d));
  for (const g of [sd, cd]) if (g.length && g.some(d => d.getUTCDay() === 0 || isFixed(d))) add(nextFree(g[2]), "대체공휴일");
  for (const x of [...fixed, bud].filter(Boolean)) { const inLunar = [...sd, ...cd].some(z => iso(z) === iso(x)); if (!inLunar && (x.getUTCDay() === 0 || x.getUTCDay() === 6 || (bud && x !== bud && iso(x) === iso(bud)))) add(nextFree(x), "대체공휴일"); }
  return (HOLI_CACHE[y] = out);
}
const holidayOf = isoDate => holidays(+isoDate.slice(0, 4))[isoDate] || "";

/* ---------- 섬 지도: 지역 기준점으로 나눈 자연스러운 권역(보로노이) ---------- */
const COAST = [[126.163,33.293],[126.18,33.33],[126.24,33.405],[126.29,33.44],[126.33,33.468],[126.42,33.49],[126.5,33.517],[126.57,33.52],[126.64,33.54],[126.72,33.555],[126.79,33.56],[126.86,33.527],[126.905,33.5],[126.94,33.465],[126.935,33.44],[126.9,33.405],[126.86,33.36],[126.83,33.325],[126.75,33.285],[126.68,33.272],[126.6,33.245],[126.53,33.24],[126.45,33.243],[126.4,33.236],[126.34,33.225],[126.3,33.218],[126.27,33.198],[126.23,33.215],[126.2,33.235],[126.17,33.265]];
const SEEDS = { jejusi: [126.52, 33.465], aewol: [126.31, 33.41], andeok: [126.27, 33.265], jungmun: [126.43, 33.275], seogwipo: [126.575, 33.275], namwon: [126.74, 33.315], seongsan: [126.885, 33.43], gujwa: [126.74, 33.49] };
function projector(b, W, H, pad) { const k = Math.cos(33.37 * Math.PI / 180); const s = Math.min((W - pad * 2) / ((b[2] - b[0]) * k), (H - pad * 2) / (b[3] - b[1])); const ox = (W - (b[2] - b[0]) * k * s) / 2, oy = (H - (b[3] - b[1]) * s) / 2; return (lon, lat) => [ox + (lon - b[0]) * k * s, oy + (b[3] - lat) * s]; }
function denseCoast(pts) { const n = pts.length, out = []; for (let i = 0; i < n; i++) { const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
  for (let k = 0; k < 12; k++) { const t = k / 12, t2 = t * t, t3 = t2 * t; out.push([0, 1].map(j => .5 * (2 * p1[j] + (-p0[j] + p2[j]) * t + (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * t2 + (-p0[j] + 3 * p1[j] - 3 * p2[j] + p3[j]) * t3))); } } return out; }
function clipHalf(poly, a, b) { /* a 쪽에 더 가까운 반평면만 남긴다 */
  const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, nx = b[0] - a[0], ny = b[1] - a[1];
  const side = p => (p[0] - mx) * nx + (p[1] - my) * ny; const out = [];
  for (let i = 0; i < poly.length; i++) { const p = poly[i], q = poly[(i + 1) % poly.length], sp = side(p), sq = side(q);
    if (sp <= 0) out.push(p); if ((sp < 0) !== (sq < 0)) { const t = sp / (sp - sq); out.push([p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t]); } }
  return out;
}
const pathOf = pts => "M" + pts.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join("L") + "Z";
function centroid(pts) { let a = 0, x = 0, y = 0; for (let i = 0; i < pts.length; i++) { const p = pts[i], q = pts[(i + 1) % pts.length], c = p[0] * q[1] - q[0] * p[1]; a += c; x += (p[0] + q[0]) * c; y += (p[1] + q[1]) * c; } return [x / (3 * a), y / (3 * a)]; }
let MAP = null;
function buildMap() {
  const W = 960, H = 470, P = projector([126.14, 33.19, 126.96, 33.57], W, H, 10);
  const isle = denseCoast(COAST.map(c => P(...c)));
  const seeds = Object.fromEntries(Object.entries(SEEDS).map(([k, v]) => [k, P(...v)]));
  const zones = R.map(r => { let poly = isle; for (const [k, s] of Object.entries(seeds)) if (k !== r.id) poly = clipHalf(poly, seeds[r.id], s); return { r, d: pathOf(poly), c: centroid(poly) }; });
  return { W, H, isle: pathOf(isle), zones };
}
function islandMap() {
  MAP = MAP || buildMap();
  return `<svg viewBox="0 0 ${MAP.W} ${MAP.H}" role="group" aria-label="제주 지도. 지역을 눌러 고르세요">
    ${MAP.zones.map(z => `<g class="zone ${pick === z.r.id ? "on" : ""}" tabindex="0" role="button" data-pick="${z.r.id}" aria-pressed="${pick === z.r.id}" aria-label="${esc(z.r.name)}, 공항에서 차로 ${esc(z.r.drive)}">
      <path d="${z.d}"/><text x="${z.c[0].toFixed(1)}" y="${(z.c[1] + 6).toFixed(1)}" text-anchor="middle">${esc(z.r.name.replace(" · ", "·"))}</text></g>`).join("")}
    <path class="coast" d="${MAP.isle}"/>
  </svg>`;
}
let pick = "jejusi";

/* ---------- 여행 준비 ---------- */
const PREP = [
  { id: "before", t: "떠나기 전", items: ["항공권·숙소·렌터카 예약 확인", "부모님 복용 약과 여유분 챙기기", "신분증·카드·현금 확인", "제주 날씨와 바람 확인", "편한 신발과 겉옷 준비", "가려는 식당 영업시간·대기 확인", "공항·숙소·주요 장소 주차 확인"] },
  { id: "during", t: "여행 중", items: ["하루 이동은 이웃한 1~2지역만", "2시간마다 화장실·휴식 넣기", "물·간식·상비약 늘 챙기기", "식당 출발 전 영업과 대기 다시 확인", "부모님 컨디션 보고 일정 줄이기", "모자·겉옷으로 바람과 햇볕 막기", "다음 날 동선과 날씨 미리 보기"] },
  { id: "after", t: "돌아오기 전", items: ["숙소에 두고 온 물건 확인", "냉장고·충전기·개인 소지품 확인", "렌터카 연료·충전 상태 확인", "렌터카 반납 시간 확인", "비행기 출발 시각과 공항까지 시간 확인", "부모님 약·지갑·휴대폰 확인", "기념품과 영수증 확인"] }
];
let checks = store.get("jeju-prep", {});
function prepList(g, limit) {
  const done = g.items.filter((_, i) => checks[g.id + i]).length;
  const items = limit ? g.items.slice(0, limit) : g.items;
  return `<div class="ck-h"><h3>${g.t}</h3><span class="prog tnum" aria-live="polite"><b>${done}</b> / ${g.items.length} 완료</span></div>
    <div class="bar2" aria-hidden="true"><i style="width:${done / g.items.length * 100}%"></i></div>
    <ul class="ck">${items.map((t, i) => `<li><label for="ck-${g.id}-${i}"><span class="no tnum">${String(i + 1).padStart(2, "0")}</span><input type="checkbox" id="ck-${g.id}-${i}" data-ck="${g.id + i}" ${checks[g.id + i] ? "checked" : ""}><span>${esc(t)}</span></label></li>`).join("")}</ul>`;
}
