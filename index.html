<title>제주 곁에</title>
<meta name="description" content="부모님과 함께 떠나는 편안한 제주 여행 안내서">
<style>
/* Layout: 에디토리얼 여행 잡지. 12열 그리드, 8px 간격 체계.
   홈 = [제목·소개·버튼·지역 색인 | 큰 섬 지도] → 선택 지역 미리보기(큰 사진) → 여행 준비 미리보기.
   지역 = 전면 사진 → 비교 띠 → 명소 행 → 맛집 행(순위별) → 쉬어가기·이동·반나절 동선. */
@font-face{font-family:"Pretendard Variable";font-weight:45 920;font-style:normal;font-display:swap;
  src:url("PretendardVariable.woff2") format("woff2-variations"),url("PretendardVariable.woff2") format("woff2")}
:root{
  color-scheme:light;
  --ivory:#F4F0E8;   /* 바탕 */
  --paper:#FBF8F2;   /* 지도 지역 · 상세 창 */
  --char:#20201D;    /* 글자 · 진한 면 */
  --ink-2:#55524B;   /* 보조 글자 */
  --rule:#D6CEBF;    /* 가는 선 */
  --accent:#D9682F;  /* 감귤 — 선택·진행 표시에만 */
  --accent-ink:#A9471A;
  --font:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
html{font-size:18px}
html.s2{font-size:20px} html.s3{font-size:22px}
*{box-sizing:border-box}
body{margin:0;background:var(--ivory);color:var(--char);font-family:var(--font);font-weight:400;font-size:1rem;line-height:1.7;letter-spacing:-.005em;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.2;letter-spacing:-.025em;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:left}
a{color:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.tnum{font-variant-numeric:tabular-nums}
.wrap{max-width:1720px;margin:0 auto;padding-inline:max(20px,4.5vw)}
.g{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:40px}
.eyebrow{font-size:.9rem;font-weight:500;color:var(--ink-2);letter-spacing:.01em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:52px;padding:0 28px;border:1px solid var(--char);border-radius:2px;font-weight:600;font-size:1rem;text-decoration:none;white-space:nowrap}
.btn.solid{background:var(--char);color:var(--ivory)}
.btn.solid:hover{background:#000}
.btn:not(.solid):hover{background:var(--char);color:var(--ivory)}
.btn:disabled{opacity:.55;cursor:wait}
.link{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px;text-decoration-color:var(--rule);min-height:44px;display:inline-flex;align-items:center}
.link:hover{text-decoration-color:var(--char)}
.tabs{display:flex;gap:0 28px;flex-wrap:wrap}
.tabs button{min-height:44px;font-size:1rem;font-weight:500;color:var(--ink-2);border-bottom:2px solid transparent}
.tabs button[aria-pressed="true"]{color:var(--char);border-bottom-color:var(--accent)}
.warn{color:var(--accent-ink);font-weight:600}

/* 머리 */
.mast .wrap{display:flex;align-items:center;gap:40px;min-height:84px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;min-height:44px}
.brand svg{width:34px;height:34px;flex:none}
.brand b{font-size:1.3rem;font-weight:700;letter-spacing:-.03em}
.nav{display:flex;gap:32px;margin-left:auto}
.nav button{min-height:44px;font-size:1rem;font-weight:500;color:var(--ink-2);border-bottom:2px solid transparent}
.nav button[aria-current="true"]{color:var(--char);border-bottom-color:var(--accent)}
.sizes{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--ink-2)}
.sizes button{width:44px;height:44px;border:1px solid var(--rule);border-radius:2px;text-align:center;font-weight:600}
.sizes button[aria-pressed="true"]{border-color:var(--char);background:var(--char);color:var(--ivory)}
.sizes button:nth-of-type(1){font-size:.85rem}.sizes button:nth-of-type(3){font-size:1.15rem}
main{min-height:60vh}
.foot{margin-top:120px;border-top:1px solid var(--rule)}
.foot .wrap{display:flex;justify-content:space-between;gap:16px 40px;flex-wrap:wrap;padding-block:28px 48px;font-size:.9rem;color:var(--ink-2)}

/* ---------- 홈 ---------- */
.hero{padding-block:40px 72px;align-items:center}
.hero-l{grid-column:1/6;display:grid;gap:28px;align-content:center}
.hero-l h1{font-size:clamp(2.9rem,4.4vw,4.45rem);font-weight:800;letter-spacing:-.045em;line-height:1.12}
.hero-l .intro{font-size:1.1rem;color:var(--ink-2);max-width:27em}
.ridx{list-style:none;margin:8px 0 0;padding:0;border-top:1px solid var(--char);display:grid;grid-template-columns:1fr 1fr;column-gap:32px}
.ridx li{border-bottom:1px solid var(--rule)}
.ridx button{width:100%;min-height:52px;display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:8px;position:relative}
.ridx .n{font-size:.85rem;color:var(--ink-2);font-weight:500}
.ridx b{font-size:1.05rem;font-weight:600}
.ridx small{font-size:.85rem;color:var(--ink-2);white-space:nowrap}
.ridx button[aria-pressed="true"] .n,.ridx button[aria-pressed="true"] b{color:var(--accent-ink)}
.ridx button[aria-pressed="true"]::before{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent)}
.ridx button:hover b{text-decoration:underline;text-underline-offset:4px}
.hero-map{grid-column:6/13;position:relative}
.hero-map svg{width:100%;height:auto;display:block}
.zone{cursor:pointer}
.zone path{fill:var(--paper);stroke:var(--rule);stroke-width:1.2;transition:fill .25s}
.zone:hover path{fill:#F1D9CA}
.zone.on path{fill:var(--accent)}
.zone text{pointer-events:none;fill:var(--char);font-family:var(--font);font-size:21px;font-weight:500;letter-spacing:-.02em}
.zone.on text{fill:#fff;font-weight:700}
.zone:focus{outline:none}
.zone:focus-visible path{stroke:var(--char);stroke-width:2.5}
.coast{fill:none;stroke:var(--char);stroke-width:1.6;pointer-events:none}
.map-note{font-size:.85rem;color:var(--ink-2);margin-top:8px;text-align:right}
.preview{padding-block:0 96px;align-items:end}
.pv-img{grid-column:1/9}
.pv-img .frame{aspect-ratio:16/9;overflow:hidden;background:#D8D0C2}
.pv-img img{width:100%;height:100%;object-fit:cover}
.cap{font-size:.85rem;color:var(--ink-2);margin-top:10px}
.pv-info{grid-column:9/13;display:grid;gap:22px;align-content:end;padding-bottom:30px}
.pv-info .eyebrow b{color:var(--accent-ink);font-weight:600}
.pv-info h2{font-size:clamp(2.2rem,3vw,2.6rem);font-weight:800;letter-spacing:-.035em}
.pv-info p{font-size:1.05rem;color:var(--ink-2)}
.facts4{display:grid;grid-template-columns:1fr 1fr;gap:18px 24px;margin:0;border-top:1px solid var(--char);padding-top:18px}
.facts4 dt{font-size:.85rem;color:var(--ink-2)}
.facts4 dd{margin:2px 0 0;font-size:1.15rem;font-weight:700;line-height:1.35}
.prep-h{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;border-top:1px solid var(--char);padding-top:20px;margin-bottom:8px}
.prep-h h2{font-size:clamp(1.8rem,2.2vw,2.2rem);font-weight:700}
.prep-cols{column-gap:64px}
.prep-cols > div{grid-column:span 6}

/* 체크리스트 */
.ck-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-block:22px 6px}
.ck-h h3{font-size:1.25rem;font-weight:700}
.ck-h .prog{font-size:.95rem;color:var(--ink-2)}
.ck-h .prog b{color:var(--accent-ink);font-weight:700}
.bar{height:3px;background:var(--rule);margin-bottom:6px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.ck{list-style:none;margin:0;padding:0}
.ck li{border-bottom:1px solid var(--rule)}
.ck label{display:grid;grid-template-columns:36px 26px minmax(0,1fr);gap:14px;align-items:center;min-height:60px;padding-block:10px;cursor:pointer;font-size:1.05rem}
.ck .no{font-size:.85rem;color:var(--ink-2);font-weight:500}
.ck input{appearance:none;-webkit-appearance:none;width:26px;height:26px;margin:0;border:1.5px solid var(--char);border-radius:2px;display:grid;place-items:center;cursor:pointer;background:transparent}
.ck input:checked{background:var(--accent);border-color:var(--accent)}
.ck input:checked::after{content:"";width:12px;height:7px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.ck input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.ck input:checked + span{color:var(--ink-2)}

/* ---------- 지역 ---------- */
.r-bar{display:flex;justify-content:space-between;gap:8px 24px;flex-wrap:wrap;align-items:center;font-size:.95rem;color:var(--ink-2);padding-block:4px 12px}
.r-bar nav{display:flex;gap:24px}
.cover{position:relative;height:min(72vh,760px);min-height:380px;overflow:hidden;background:var(--char)}
.cover img{width:100%;height:100%;object-fit:cover}
.cover::after{content:"";position:absolute;left:0;right:0;bottom:0;height:66%;background:linear-gradient(to top,rgba(0,0,0,.62) 0%,rgba(0,0,0,.28) 45%,rgba(0,0,0,.03) 78%,transparent 100%)}
.cover::before{content:"";position:absolute;inset:0;background:linear-gradient(to right,rgba(0,0,0,.3) 0%,rgba(0,0,0,.1) 45%,transparent 70%)}
.cover .wrap{position:absolute;left:0;right:0;bottom:0;z-index:1;padding-bottom:56px;color:#fff;display:grid;gap:14px}
.cover .no{font-size:1rem;font-weight:500}
.cover h1{font-size:clamp(3rem,5.2vw,5rem);font-weight:800;letter-spacing:-.045em;line-height:1.08}
.cover p{font-size:1.15rem;max-width:36em;line-height:1.6}
.cover-cap{padding-top:10px}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px;margin:56px 0 104px}
.strip div{border-top:2px solid var(--char);padding-top:16px}
.strip dt{font-size:.9rem;color:var(--ink-2)}
.strip dd{margin:6px 0 0;font-size:clamp(1.35rem,1.7vw,1.65rem);font-weight:700;line-height:1.3;letter-spacing:-.02em}
.strip dd span{display:block;font-size:.95rem;font-weight:400;color:var(--ink-2);margin-top:6px;letter-spacing:0;line-height:1.5}
.sec{margin-bottom:112px}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:12px 24px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--char)}
.sec-h h2{font-size:clamp(2rem,2.4vw,2.4rem);font-weight:700}
.sec-h p{font-size:.95rem;color:var(--ink-2)}
.rows{list-style:none;margin:0;padding:0}
.rows > li{border-bottom:1px solid var(--rule)}
.rows .row{width:100%;display:grid;grid-template-columns:56px minmax(0,1fr) 13rem 15rem 7rem;gap:28px;align-items:start;padding-block:26px}
.rows .row:hover .nm{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}
.rows .k{font-size:.95rem;font-weight:600;color:var(--accent-ink);padding-top:4px}
.rows .nm{font-size:1.3rem;font-weight:700;line-height:1.35;letter-spacing:-.02em}
.rows .cat{display:block;font-size:.85rem;color:var(--ink-2);font-weight:500;margin-bottom:2px}
.rows .why{font-size:1rem;color:var(--ink-2);margin-top:6px}
.rows .v{font-size:1rem;font-weight:600;line-height:1.45}
.rows .v small{display:block;font-size:.9rem;font-weight:400;color:var(--ink-2);margin-top:2px}
.rows .v .lab{display:block;font-size:.8rem;font-weight:500;color:var(--ink-2);margin-bottom:2px}
.rows .go{font-size:.95rem;font-weight:600;padding-top:4px;text-align:right;white-space:nowrap}
.hi{color:var(--accent-ink)}
.rows .row.fr{grid-template-columns:10rem minmax(0,1fr) 13rem 13rem 7rem}
.rows .row.fr .k{font-size:1.05rem;font-weight:700}
.rows .k small{display:block;font-size:.85rem;font-weight:400;color:var(--ink-2);margin-top:2px}
.tier-h{display:grid;grid-template-columns:56px minmax(0,1fr);gap:28px;padding:32px 0 8px;border-bottom:1px solid var(--rule)}
.tier-h b{font-size:1.15rem;font-weight:700;color:var(--accent-ink);grid-column:2}
.tier-h span{color:var(--ink-2);font-weight:400;margin-left:12px;font-size:1rem}
.empty{padding-block:24px;color:var(--ink-2)}
.three{column-gap:56px}
.three > div{grid-column:span 4;border-top:1px solid var(--char);padding-top:18px;display:grid;gap:14px;align-content:start}
.three h2{font-size:1.6rem;font-weight:700}
.lines{list-style:none;margin:0;padding:0}
.lines li{padding:14px 0;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;font-size:1rem}
.lines .k{color:var(--accent-ink);font-weight:600}
.lines b{font-weight:700}
.lines small{display:block;font-size:.95rem;color:var(--ink-2)}
.lines button.item{display:block;width:100%}
.lines .drive{display:block;font-size:.9rem;color:var(--ink-2);margin-top:4px}

/* ---------- 상세 창 ---------- */
.scrim{position:fixed;inset:0;background:rgba(32,32,29,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(660px,100%);background:var(--paper);z-index:41;display:flex;flex-direction:column}
.d-bar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:calc(env(safe-area-inset-top,0px) + 14px) 36px 14px;border-bottom:1px solid var(--rule);flex:none}
.d-bar span{font-size:.95rem;color:var(--ink-2)}
.d-body{overflow:auto;padding:28px 36px calc(48px + env(safe-area-inset-bottom,0px));display:grid;gap:24px;align-content:start}
.d-photo{width:100%;aspect-ratio:3/2;object-fit:cover}
.d-body h2{font-size:2.3rem;font-weight:800;letter-spacing:-.035em}
.d-why{border-left:3px solid var(--accent);padding-left:18px}
.d-why b{display:block;font-size:.85rem;font-weight:600;color:var(--accent-ink)}
.dl{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px;border-top:1px solid var(--char)}
.dl div{padding:12px 0;border-bottom:1px solid var(--rule);min-width:0}
.dl .wide{grid-column:1/-1}
.dl dt{font-size:.85rem;color:var(--ink-2)}
.dl dd{margin:2px 0 0;font-size:1rem}
.dl a{text-underline-offset:3px}
.d-actions{display:flex;gap:10px;flex-wrap:wrap}
.d-actions .btn{flex:1 1 11rem;padding:0 16px}
.src{font-size:.85rem;color:var(--ink-2)}

/* ---------- 코스 ---------- */
.c-wrap{padding-top:40px}
.c-ctrl{grid-column:1/5;display:grid;gap:28px;align-content:start}
.c-ctrl h1{font-size:clamp(2.6rem,3.6vw,3.6rem);font-weight:800;letter-spacing:-.04em}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fld{display:grid;gap:6px;cursor:pointer}
.fld span{font-size:.9rem;font-weight:500;color:var(--ink-2)}
.fld input{font:inherit;font-size:1rem;height:56px;width:100%;padding:0 14px;border:1px solid var(--char);border-radius:2px;background:transparent;min-width:0;cursor:pointer}
.opt{display:flex;gap:14px;align-items:center;font-size:1rem;min-height:48px;cursor:pointer}
.opt input{appearance:none;-webkit-appearance:none;width:24px;height:24px;margin:0;border:1.5px solid var(--char);border-radius:2px;display:grid;place-items:center;cursor:pointer;flex:none}
.opt input:checked{background:var(--accent);border-color:var(--accent)}
.opt input:checked::after{content:"";width:11px;height:6px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.c-rules{border-top:1px solid var(--rule);padding-top:18px;display:grid;gap:6px;font-size:.95rem;color:var(--ink-2)}
.c-rules b{color:var(--char);font-weight:600}
.c-out{grid-column:5/13}
.status{font-size:.95rem;color:var(--ink-2);min-height:1.7em;margin-top:12px}
.csum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px;margin:20px 0 48px}
.csum div{border-top:2px solid var(--char);padding-top:14px}
.csum dt{font-size:.9rem;color:var(--ink-2)}
.csum dd{margin:4px 0 0;font-size:1.45rem;font-weight:700;line-height:1.3}
.csum dd span{display:block;font-size:.9rem;font-weight:400;color:var(--ink-2)}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(17rem,1fr));gap:0 40px}
.day{display:grid;gap:10px;align-content:start;padding-bottom:48px}
.day .dn{font-size:.9rem;font-weight:600;color:var(--accent-ink)}
.day h3{font-size:1.45rem;font-weight:700}
.day .stay,.day .dstat{font-size:.95rem;color:var(--ink-2)}
.day .dstat b{color:var(--char)}
.day .hol{font-size:.95rem;font-weight:600;color:var(--accent-ink)}
.tl{list-style:none;margin:6px 0 0;padding:0;border-top:1px solid var(--char)}
.tl li > *{display:grid;grid-template-columns:58px minmax(0,1fr);gap:10px;padding:14px 0;border-bottom:1px solid var(--rule);width:100%}
.tl time{font-size:.95rem;font-weight:500;color:var(--ink-2)}
.tl b{display:block;font-weight:700;font-size:1rem}
.tl small{display:block;font-size:.9rem;color:var(--ink-2)}
.tl .k{font-weight:600;color:var(--accent-ink);margin-right:8px}

/* ---------- 여행 준비 ---------- */
.prep-page{padding-top:40px}
.prep-top{display:flex;justify-content:space-between;align-items:end;gap:16px 40px;flex-wrap:wrap;margin-bottom:40px}
.prep-top h1{font-size:clamp(2.6rem,3.6vw,3.6rem);font-weight:800;letter-spacing:-.04em}
.prep-top p{color:var(--ink-2);max-width:34em}
.prep3{column-gap:56px}
.prep3 > div{grid-column:span 4;border-top:1px solid var(--char)}

/* ---------- 출처 ---------- */
.cr{padding-top:40px}
.cr-info{grid-column:1/5;display:grid;gap:16px;align-content:start;color:var(--ink-2)}
.cr-info h1{font-size:clamp(2.4rem,3.2vw,3.2rem);font-weight:800;letter-spacing:-.04em;color:var(--char)}
.cr-main{grid-column:5/13;display:grid;gap:64px}
.cr-sec{border-top:1px solid var(--char);padding-top:18px;display:grid;gap:12px;color:var(--ink-2)}
.cr-sec h2{font-size:1.6rem;font-weight:700;color:var(--char)}
.cr-list{columns:2 20rem;column-gap:40px;margin-top:8px}
.cr-list p{break-inside:avoid;padding:12px 0;border-bottom:1px solid var(--rule);font-size:.9rem}
.cr-list b{display:block;color:var(--char);font-weight:600;font-size:1rem}

/* ---------- 반응형 ---------- */
@media (max-width:1280px){
  .rows .row{grid-template-columns:48px minmax(0,1fr) 11rem 12rem;}
  .rows .row.fr{grid-template-columns:8rem minmax(0,1fr) 11rem 10rem}
  .rows .go{display:none}
  .c-ctrl,.c-out,.cr-info,.cr-main{grid-column:1/-1}
  .c-out,.cr-main{margin-top:48px}
  .prep3 > div{grid-column:1/-1;margin-bottom:32px}
}
@media (max-width:1000px){
  .g{column-gap:24px}
  .hero-l,.hero-map,.pv-img,.pv-info{grid-column:1/-1}
  .hero{padding-block:16px 48px}
  .hero-map{order:-1;margin-bottom:8px}
  .pv-info{padding:24px 0 0}
  .prep-cols > div{grid-column:1/-1}
  .strip,.csum{grid-template-columns:1fr 1fr;gap:28px}
  .strip{margin:40px 0 72px}
  .three > div{grid-column:1/-1;margin-bottom:32px}
  .rows .row,.rows .row.fr{grid-template-columns:40px minmax(0,1fr);gap:6px 16px;padding-block:20px}
  .rows .row.fr .k,.rows .row.fr > span:nth-child(2),.rows .row.fr .v{grid-column:1/-1}
  .rows .row.fr .k small{display:inline;margin-left:8px}
  .rows .v{grid-column:2}
  .rows .v .lab{display:inline;margin-right:8px}
  .rows .v small{display:inline;margin-left:6px}
  .tier-h{grid-template-columns:40px minmax(0,1fr);gap:16px}
  .sec{margin-bottom:80px}
  .nav{order:3;width:100%;margin:0;gap:24px}
  .mast .wrap{padding-block:8px;gap:8px 24px}
  .sizes{margin-left:auto}.sizes > span{display:none}

<script>

const parkShort = t => { const x = String(t || "").replace(/\s*\(.*\)$/, "").replace(/^주차장\s*→\s*입구\s*/, "").replace(/^주차장\s*→\s*/, "").replace(/^(해변 |공영 |시장 공영 )?주차장 바로 앞/, "바로 앞"); return /^(약|바로)/.test(x) ? "입구까지 " + x : x; };
const CAT = { all: "전체", soup: "국·탕·죽", noodle: "국수", sea: "생선·해산물", meat: "고기" };

const COVER_CREDIT = { jejusi: "iho", aewol: "hyeopjae", andeok: "yongmeori", jungmun: "jusang", seogwipo: "cheonjiyeon", namwon: "pyoseon", seongsan: "seongsan", gujwa: "hamdeok" };

function km(a, b) { const t = Math.PI / 180, x = (b.lon - a.lon) * t * Math.cos((a.lat + b.lat) / 2 * t), y = (b.lat - a.lat) * t; return Math.sqrt(x * x + y * y) * 6371; }

/* ---------- 한국 공휴일: 단기력(음력)으로 해마다 계산, 대체공휴일 포함 ---------- */
const ELECTION = { "2026-06-03": "지방선거일", "2028-04-12": "국회의원선거일" };
const HOLI_CACHE = {};
function holidays(y) {
  if (HOLI_CACHE[y]) return HOLI_CACHE[y];
  const out = {}, iso = d => d.toISOString().slice(0, 10), D = (m, d) => new Date(Date.UTC(y, m - 1, d)), sh = (d, k) => new Date(d.getTime() + k * 864e5);
  let fmt; try { fmt = new Intl.DateTimeFormat("ko-KR-u-ca-dangi", { month: "numeric", day: "numeric", timeZone: "UTC" }); } catch (e) { fmt = null; }
  const lunar = (lm, ld) => { if (!fmt) return null; for (let t = Date.UTC(y, 0, 1); t < Date.UTC(y + 1, 0, 1); t += 864e5) { const p = fmt.formatToParts(new Date(t)); const m = p.find(x => x.type === "month")?.value, d = p.find(x => x.type === "day")?.value; if (m === String(lm) && +d === ld) return new Date(t); } return null; };
  const add = (d, n) => { if (d && !out[iso(d)]) out[iso(d)] = n; };
  add(D(1, 1), "신정");
  const seol = lunar(1, 1), chu = lunar(8, 15), bud = lunar(4, 8);
  const sd = seol ? [sh(seol, -1), seol, sh(seol, 1)] : [], cd = chu ? [sh(chu, -1), chu, sh(chu, 1)] : [];
  sd.forEach((d, i) => add(d, i === 1 ? "설날" : "설날 연휴"));
  add(D(3, 1), "삼일절"); add(D(5, 5), "어린이날"); add(bud, "부처님오신날"); add(D(6, 6), "현충일"); add(D(8, 15), "광복절");
  cd.forEach((d, i) => add(d, i === 1 ? "추석" : "추석 연휴"));
  add(D(10, 3), "개천절"); add(D(10, 9), "한글날"); add(D(12, 25), "성탄절");
  Object.entries(ELECTION).forEach(([k, v]) => { if (k.startsWith(y + "-")) out[k] = v; });
  const fixed = [[3, 1], [5, 5], [8, 15], [10, 3], [10, 9], [12, 25]].map(([m, d]) => D(m, d));
  const nextFree = d => { let x = sh(d, 1); while (x.getUTCDay() === 0 || x.getUTCDay() === 6 || out[iso(x)]) x = sh(x, 1); return x; };
  const isFixed = d => fixed.some(f => iso(f) === iso(d)) || (bud && iso(bud) === iso(d));
  for (const g of [sd, cd]) if (g.length && g.some(d => d.getUTCDay() === 0 || isFixed(d))) add(nextFree(g[2]), "대체공휴일");
  for (const x of [...fixed, bud].filter(Boolean)) { const inLunar = [...sd, ...cd].some(z => iso(z) === iso(x)); if (!inLunar && (x.getUTCDay() === 0 || x.getUTCDay() === 6 || (bud && x !== bud && iso(x) === iso(bud)))) add(nextFree(x), "대체공휴일"); }
  return (HOLI_CACHE[y] = out);
}
const holidayOf = isoDate => holidays(+isoDate.slice(0, 4))[isoDate] || "";

/* ---------- 섬 지도: 지역 기준점으로 나눈 자연스러운 권역(보로노이) ---------- */
const COAST = [[126.163,33.293],[126.18,33.33],[126.24,33.405],[126.29,33.44],[126.33,33.468],[126.42,33.49],[126.5,33.517],[126.57,33.52],[126.64,33.54],[126.72,33.555],[126.79,33.56],[126.86,33.527],[126.905,33.5],[126.94,33.465],[126.935,33.44],[126.9,33.405],[126.86,33.36],[126.83,33.325],[126.75,33.285],[126.68,33.272],[126.6,33.245],[126.53,33.24],[126.45,33.243],[126.4,33.236],[126.34,33.225],[126.3,33.218],[126.27,33.198],[126.23,33.215],[126.2,33.235],[126.17,33.265]];
const SEEDS = { jejusi: [126.52, 33.465], aewol: [126.31, 33.41], andeok: [126.27, 33.265], jungmun: [126.43, 33.275], seogwipo: [126.575, 33.275], namwon: [126.74, 33.315], seongsan: [126.885, 33.43], gujwa: [126.74, 33.49] };
function projector(b, W, H, pad) { const k = Math.cos(33.37 * Math.PI / 180); const s = Math.min((W - pad * 2) / ((b[2] - b[0]) * k), (H - pad * 2) / (b[3] - b[1])); const ox = (W - (b[2] - b[0]) * k * s) / 2, oy = (H - (b[3] - b[1]) * s) / 2; return (lon, lat) => [ox + (lon - b[0]) * k * s, oy + (b[3] - lat) * s]; }
function denseCoast(pts) { const n = pts.length, out = []; for (let i = 0; i < n; i++) { const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
  for (let k = 0; k < 12; k++) { const t = k / 12, t2 = t * t, t3 = t2 * t; out.push([0, 1].map(j => .5 * (2 * p1[j] + (-p0[j] + p2[j]) * t + (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * t2 + (-p0[j] + 3 * p1[j] - 3 * p2[j] + p3[j]) * t3))); } } return out; }
function clipHalf(poly, a, b) { /* a 쪽에 더 가까운 반평면만 남긴다 */
  const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, nx = b[0] - a[0], ny = b[1] - a[1];
  const side = p => (p[0] - mx) * nx + (p[1] - my) * ny; const out = [];
  for (let i = 0; i < poly.length; i++) { const p = poly[i], q = poly[(i + 1) % poly.length], sp = side(p), sq = side(q);
    if (sp <= 0) out.push(p); if ((sp < 0) !== (sq < 0)) { const t = sp / (sp - sq); out.push([p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t]); } }
  return out;
}
const pathOf = pts => "M" + pts.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join("L") + "Z";
function centroid(pts) { let a = 0, x = 0, y = 0; for (let i = 0; i < pts.length; i++) { const p = pts[i], q = pts[(i + 1) % pts.length], c = p[0] * q[1] - q[0] * p[1]; a += c; x += (p[0] + q[0]) * c; y += (p[1] + q[1]) * c; } return [x / (3 * a), y / (3 * a)]; }
let MAP = null;
function buildMap() {

}
let pick = "jejusi";

/* ---------- 여행 준비 ---------- */
const PREP = [

/* ---------- 홈 ---------- */

function typicalWait(r) { const busy = r.foods.filter(f => f.wait === "많음").length, rest = r.foods.filter(f => f.wait !== "많음"); const c = { 보통: 0, 적음: 0 }; rest.forEach(f => c[f.wait]++); const usual = c.보통 >= c.적음 ? "보통" : "적음"; return busy ? `1순위 ${busy}곳 많음 · 나머지 ${usual}` : usual; }

/* ---------- 지역 ---------- */
let st = { cat: "all", easy: false };
const lunchOk = f => { const m = /(\d\d):\d\d~(\d\d):\d\d/.exec(f.hours || ""); return !m || (+m[1] <= 12 && +m[2] >= 14); };

  const food = [...r.foods].filter(lunchOk).sort((a, b) => a.tier - b.tier || driveMin(spot, a) - driveMin(spot, b))[0] || r.foods[0];

  });
  return { days };
}
const MAJOR = h => /^(설날|추석)$/.test(h);
function viewCourse() {
  const c = course.result, today = isoL(new Date());
  const ds = c.days.filter(d => d.stats);
  const drive = ds.reduce((a, d) => a + d.stats.drive, 0), stops = ds.reduce((a, d) => a + d.stats.stops, 0), rests = ds.reduce((a, d) => a + d.stats.rests, 0);
  const walk = ds.some(d => d.stats.walk === "많음") ? "많음" : ds.some(d => d.stats.walk === "보통") ? "보통" : "가벼움";
  const pace = ds.some(d => d.stats.pace === "빠듯함") ? "빠듯함" : ds.filter(d => d.stats.pace === "보통").length > ds.length / 2 ? "보통" : "여유";
  return `<section class="wrap g c-wrap">
    <div class="c-ctrl">
      <h1>코스 추천</h1>
      <div class="dates">
        <label class="fld" for="dFrom"><span>가는 날</span><input type="date" id="dFrom" value="${course.from}" min="${today}" max="2050-12-31"></label>
        <label class="fld" for="dTo"><span>오는 날</span><input type="date" id="dTo" value="${course.to}" min="${course.from || today}" max="2050-12-31"></label>
      </div>
      <div><span class="eyebrow">날짜 없이 기간만 고르기</span>
        <div class="tabs" role="group" aria-label="여행 기간">${[1, 2, 3, 4].map(n => `<button type="button" id="n${n}" data-nights="${n}" aria-pressed="${course.nights === n}">${n}박 ${n + 1}일</button>`).join("")}</div></div>
      <div>
        <label class="opt" for="optEasy"><input type="checkbox" id="optEasy" ${course.easy ? "checked" : ""}>걷기 적은 곳 위주</label>
        <label class="opt" for="optRain"><input type="checkbox" id="optRain" ${course.rain ? "checked" : ""}>비 오는 날 (실내 먼저)</label>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn solid" type="button" id="btnAI">내 조건으로 코스 만들기</button>
        <button class="btn" type="button" id="btnRoll">다른 코스 보기</button>
      </div>
      <div class="c-rules"><b>코스를 만드는 기준</b>
        <span>가는 날부터 오는 날까지 매일의 요일과 한국 공휴일을 반영합니다.</span>
        <span>그 요일에 쉬는 식당과 명소는 넣지 않습니다.</span>
        <span>하루 명소는 3곳 이하, 이웃한 지역 1~2곳만 한 방향으로 돕니다.</span>
        <span>계단이 많은 곳은 넣지 않고, 하루 한 번은 카페에서 쉽니다.</span>
        <span>‘내 조건으로 코스 만들기’는 Claude가 조건을 읽고 이 안내서에 확인된 장소 안에서만 고릅니다.</span>
        <button class="link" type="button" data-go="prep">떠나기 전 여행 준비 체크리스트 →</button></div>
    </div>
    <div class="c-out">
      <div class="sec-h"><h2>${course.nights}박 ${course.nights + 1}일${course.source === "ai" ? " · 맞춤 코스" : ""}</h2><p>${course.from ? `${dayInfo(0).date} 출발` : "날짜를 넣으면 요일과 공휴일이 반영됩니다."}</p></div>
      <p class="status" id="cStatus" role="status">${esc(course.msg)}</p>
      <dl class="csum">
        <div><dt>총 운전 시간</dt><dd class="tnum">약 ${dur(drive)}<span>하루 평균 ${dur(Math.round(drive / ds.length / 5) * 5)}</span></dd></div>
        <div><dt>방문지</dt><dd class="tnum">${stops}곳<span>식사 제외 · 카페 휴식 ${rests}회 포함</span></dd></div>
        <div><dt>걷기 부담</dt><dd>${walk}<span>계단 많은 곳 제외</span></dd></div>
        <div><dt>일정 강도</dt><dd>${pace}<span>운전·방문 수·마치는 시각 기준</span></dd></div>

      <div class="days">${c.days.map((d, i) => `<article class="day">
        <span class="dn tnum">${i + 1}일째${d.date ? ` · ${d.date} ${DOW[d.dow]}요일` : ""}</span>
        <h3>${[...new Set(d.regions)].map(x => esc(RBY[x]?.name || x)).join(" → ")}</h3>
        <p class="stay">${d.stay ? `숙소: ${esc(RBY[d.stay]?.name || "")} 쪽` : "마지막 날, 공항으로"}${d.note ? ` · ${esc(d.note)}` : ""}</p>
        ${d.stats ? `<p class="dstat tnum">운전 약 ${dur(d.stats.drive)} · 방문 ${d.stats.stops}곳 · 걷기 ${d.stats.walk} · 휴식 ${d.stats.rests}회 · <b>${d.stats.pace}</b></p>` : ""}
        ${d.hol ? `<p class="hol">${esc(d.hol)}${MAJOR(d.hol) ? " 당일이라 쉬는 식당이 많습니다. 식당은 꼭 전화로 확인하세요." : " 공휴일입니다. 붐비거나 쉬는 곳이 있을 수 있으니 방문 전 운영 여부를 확인하세요."}</p>` : ""}
        <ol class="tl">${d.items.map(it => { const p = it.id && BYID[it.id];
          if (!p) return `<li><div><time class="tnum">${esc(it.t)}</time><span><b>${esc(it.fixed || "")}</b><small>${esc(it.note || "")}${it.drive ? ` · 차로 ${it.drive}분` : ""}</small></span></div></li>`;
          const k = kindOf(p), label = k === "food" ? (it.note || "식사") : k === "rest" ? "쉼" : (p.indoor ? "실내" : "명소");
          const sub = k === "food" ? `${p.m} · 대기 ${p.wait}${MAJOR(d.hol) ? " · 명절 영업 확인" : ""}` : k === "rest" ? p.d : `걷기 ${WALK[p.w]} · ${p.stay}`;
          return `<li><button type="button" data-open="${p.id}"><time class="tnum">${esc(it.t)}</time><span><b><span class="k">${esc(label)}</span>${esc(p.n)}</b><small>${esc(sub)}${it.drive ? ` · 차로 ${it.drive}분` : ""}</small></span></button></li>`; }).join("")}</ol></article>`).join("")}</div>
    </div>
  </section>`;
}

/* 맞춤 코스 — Claude가 확인된 장소 id만 쓰게 하고, 결과를 검증·재계산한 뒤 보여 준다 */
let sampleFn, aiCtl = null;
async function askAI() {
  if (!sampleFn) {
    course.result = makeCourse(Date.now() % 1e9); course.source = "rule";
    course.msg = sampleFn === null ? "맞춤 코스는 claude.ai에 게시된 페이지를 Claude에 로그인한 상태로 열었을 때 만들 수 있습니다. 대신 기준에 맞춘 코스를 새로 보여 드립니다." : "준비 중입니다. 잠시 후 다시 눌러 주세요.";
    return render();
  }
  aiCtl?.abort(); aiCtl = new AbortController();
  $("#btnAI").disabled = true; $("#cStatus").textContent = "조건에 맞춰 코스를 만들고 있습니다. 30초에서 1분 정도 걸립니다.";
  const n = course.nights + 1;
  const dates = Array.from({ length: n }, (_, i) => dayInfo(i)).map((d, i) => d.date ? `${i + 1}일째=${d.date} ${DOW[d.dow]}요일${d.hol ? " 공휴일(" + d.hol + ")" : ""}` : "").filter(Boolean).join(", ");
  const catalog = R.map(r => `[${r.id}] ${r.name}\n 명소: ${r.spots.filter(s => s.w !== "hard").map(s => `${s.id}=${s.n}/${s.w}/${s.io}/${s.stay}`).join("; ")}\n 식당: ${r.foods.map(f => `${f.id}=${f.n}/${f.m}/${f.hours}`).join("; ")}\n 카페: ${r.rest.map(c => `${c.id}=${c.n}`).join("; ")}`).join("\n");
  const prompt = `부모님을 모시고 가는 제주 ${course.nights}박 ${n}일 여행 코스를 짜 주세요. ${dates}
규칙: 아래 목록의 id만 쓰세요. 섬 둘레 순서는 ${RING.join(" → ")}이고, 하루에 이웃한 지역 1~2곳만 한 방향으로 이동하세요. 첫날 11:00 공항 도착, 마지막 날 17:00까지 공항. 하루 명소 2~3곳, 점심·저녁 1곳씩(마지막 날 저녁 제외), 카페 1곳. 중복 금지. 영업시간과 휴무 요일을 지키세요.${course.easy ? " 걷기 mid는 하루 1곳 이하." : ""}${course.rain ? " 비 오는 날이라 실내 우선." : ""} 변화 번호 ${Math.floor(Math.random() * 1e6)}에 맞춰 매번 다른 조합으로.
목록:
${catalog}
JSON만: {"days":[{"regions":["aewol"],"stay":"aewol","note":"한 줄 설명","items":[{"t":"09:30","id":"handam"}]}]} 마지막 날 stay는 null, 공항은 items에 넣지 마세요.`;
  try {
    const out = await sampleFn.json(prompt, { signal: aiCtl.signal, cache: false });
    const days = (out?.days || []).slice(0, n).map((d, i) => {
      const items = (d.items || []).filter(it => BYID[String(it.id)]).map(it => ({ t: String(it.t || "").slice(0, 5), id: String(it.id) }));
      items.sort((a, b) => a.t.localeCompare(b.t));
      items.forEach(it => { const p = BYID[it.id]; if (kindOf(p) === "food") { const h = parseInt(it.t); it.note = h < 10 ? "아침" : h < 16 ? "점심" : "저녁"; } });
      const regs = (d.regions || []).filter(x => RBY[x]);
      return timeify({ regions: regs.length ? regs : [...new Set(items.map(x => BYID[x.id].region))], stay: RBY[d.stay] ? d.stay : null, note: String(d.note || "").slice(0, 50), items, ...dayInfo(i) }, i === 0, i === n - 1);
    });
    if (days.length !== n || days.some(d => d.items.filter(x => x.id).length < 2 || (d.stats && d.stats.drive > 240))) throw { code: "bad_shape" };
    course.result = { days }; course.source = "ai"; course.msg = "조건에 맞춘 코스입니다. 이 안내서에 확인된 장소만 사용했습니다."; render();
  } catch (e) {
    const b = $("#btnAI"); if (b) b.disabled = false;
    if (e.code === "cancelled") return;
    course.msg = ["not_granted", "sampling_disabled", "capability_disabled", "not_declared"].includes(e.code) ? "맞춤 코스 기능이 허용되지 않아 기준 코스를 보여 드립니다."
      : e.code === "rate_limited" ? "요청이 많습니다. 잠시 후 다시 눌러 주세요." : "만든 코스가 기준에 맞지 않았습니다. 다시 눌러 주세요.";
    $("#cStatus").textContent = course.msg;
  }
}
function syncDates() {
  course.msg = "";
  if (!(course.from && course.to)) return;
  const n = Math.round((new Date(course.to + "T00:00") - new Date(course.from + "T00:00")) / 864e5);
  if (n < 1) { course.msg = "오는 날은 가는 날보다 뒤여야 합니다."; return; }
  if (n > 4) { course.nights = 4; course.msg = "4박 5일까지 추천합니다. 앞의 5일 일정을 보여 드립니다."; return; }
  course.nights = n;
}

/* ---------- 여행 준비 화면 ---------- */
function viewPrep() {
  const all = PREP.reduce((a, g) => a + g.items.length, 0), done = Object.values(checks).filter(Boolean).length;
  return `<section class="wrap prep-page">
    <div class="prep-top"><div><h1>여행 준비</h1><p>부모님과 다닐 때 놓치기 쉬운 것들입니다. 체크한 내용은 이 기기에 저장됩니다.</p></div>
      <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><span class="tnum"><b class="warn">${done}</b> / ${all} 완료</span><button class="btn" type="button" id="ckReset">체크리스트 초기화</button></div></div>

/* ---------- 출처 ---------- */
function viewCredits() {

    <div class="cr-info"><span class="eyebrow">부록</span><h1>사진·정보 출처</h1><p>이 안내서에 쓴 사진, 장소 정보, 그래픽과 서체의 출처입니다.</p><p><button class="link" type="button" data-go="home">← 지역 선택으로</button></p></div>
    <div class="cr-main">
      <section class="cr-sec"><h2>1. 사진과 라이선스</h2>
        <p>Wikimedia Commons의 퍼블릭 도메인·CC 라이선스 사진만 사용했습니다. 모두 2026년 10월 9일에 내려받았고, CC BY-SA 사진은 같은 라이선스 조건을 따릅니다. 포털 지도·블로그·SNS 사진은 사용하지 않았습니다. 지역 대표 사진은 아래 장소 사진의 고해상도 판입니다.</p>
        <div class="cr-list">${(window.CREDITS || []).map(c => `<p><b>${esc(c.name)}</b>Image by ${esc(c.artist || "작가 미상")} / Wikimedia Commons · ${esc(c.lic)}<br><a href="${esc(c.url)}" target="_blank" rel="noopener">원본 페이지</a> · 2026.10.09 내려받음</p>`).join("")}</div></section>
      <section class="cr-sec"><h2>2. 장소 정보</h2>
        <p>주소, 전화, 평점, 영업시간, 브레이크 타임, 휴무, 주차, 가격, 홈페이지, 최근 후기 날짜는 2026년 10월 9일 카카오맵 장소 페이지에서 확인했습니다. 일부 입장료(성산일출봉, 비자림, 카멜리아힐, 용머리해안, 정방폭포, 주상절리, 우도 도항선)는 같은 날 웹 검색으로 확인했습니다.</p>
        <p>대기는 후기 수와 ‘웨이팅’ 언급으로 추정했습니다. 걷는 거리·경사는 일반 정보 기준 대략값이고, 이동 시간은 직선거리를 도로 거리로 환산해 계산했습니다.</p>
        <p>공휴일은 한국 법정 공휴일·대체공휴일 규정을 단기력(음력)으로 계산해 2050년까지 반영합니다. 선거일은 확정된 날짜(2026년 6월 3일, 2028년 4월 12일)만 넣었습니다. 방문 전 운영 여부를 꼭 확인하세요.</p></section>
      <section class="cr-sec"><h2>3. 그래픽과 서체</h2>
        <p>로고와 제주 지도는 이 안내서를 위해 직접 그렸습니다. 지도의 지역 경계는 여행 계획을 위한 구분이며 행정구역과 다릅니다.</p>
        <p>서체: Pretendard (SIL Open Font License 1.1)</p></section>
    </div>
  </section>`;
}

/* ---------- 라우팅 ---------- */
let route = "home";
const ROUTES = ["home", "course", "prep", "credits"];
function render() {
  const scr = $("#screen");
  if (route === "course") { if (!course.result) course.result = makeCourse(Date.now() % 1e9); scr.innerHTML = viewCourse(); }
  else if (route === "prep") scr.innerHTML = viewPrep();
  else if (route === "credits") scr.innerHTML = viewCredits();
  else if (RBY[route]) scr.innerHTML = viewRegion(route);
  else scr.innerHTML = viewHome();
  document.querySelectorAll(".nav button").forEach(b => b.setAttribute("aria-current", String(b.dataset.go === route || (b.dataset.go === "home" && (route === "home" || !!RBY[route])))));
}
function go(r) { if (RBY[r]) pick = r; route = r; st = { cat: "all", easy: false }; closeDetail(); render(); window.scrollTo(0, 0); try { history.replaceState(null, "", "#" + r); } catch (e) {} }
const reroll = () => { aiCtl?.abort(); course.result = makeCourse(Date.now() % 1e9); course.source = "rule"; render(); };
function setPick(id, focusMap) {
  pick = id; render();
  if (focusMap) document.querySelector(`.zone[data-pick="${id}"]`)?.focus();
}

document.addEventListener("click", e => {
  const fld = e.target.closest(".fld");
  if (fld) { const inp = fld.querySelector("input"); try { inp.showPicker(); } catch (err) { inp.focus(); } }
  const t = e.target.closest("[data-go],[data-region],[data-open],[data-close],[data-cat],[data-easy],[data-nights],[data-copy],[data-pick],[data-s],#btnRoll,#btnAI,#ckReset");
  if (!t) return;
  if (t.dataset.close !== undefined) return closeDetail();
  if (t.dataset.copy) { const v = t.dataset.copy; try { navigator.clipboard.writeText(v).then(() => t.textContent = "복사했습니다", () => t.textContent = v); } catch (err) { t.textContent = v; } return; }
  if (t.dataset.s) { document.documentElement.classList.remove("s2", "s3"); if (t.dataset.s !== "1") document.documentElement.classList.add("s" + t.dataset.s); document.querySelectorAll("[data-s]").forEach(b => b.setAttribute("aria-pressed", String(b === t))); store.set("jeju-fs", t.dataset.s); return; }
  if (t.dataset.pick) return setPick(t.dataset.pick, !!t.closest(".zone"));
  if (t.dataset.go) { e.preventDefault(); return go(t.dataset.go); }
  if (t.dataset.region) return go(t.dataset.region);
  if (t.dataset.open) return openDetail(t.dataset.open);
  if (t.dataset.cat) { st.cat = t.dataset.cat; return render(); }
  if (t.dataset.easy) { st.easy = t.dataset.easy === "1"; return render(); }
  if (t.dataset.nights) { course.nights = +t.dataset.nights; course.to = ""; course.msg = ""; return reroll(); }
  if (t.id === "btnRoll") { course.msg = ""; return reroll(); }
  if (t.id === "btnAI") return askAI();
  if (t.id === "ckReset") { checks = {}; store.set("jeju-prep", checks); return render(); }
});
document.addEventListener("change", e => {
  const el = e.target, id = el.id;
  if (el.dataset.ck) { checks[el.dataset.ck] = el.checked; store.set("jeju-prep", checks); const y = window.scrollY; render(); window.scrollTo(0, y); document.getElementById(id)?.focus(); return; }
  if (id === "optEasy") course.easy = el.checked;
  else if (id === "optRain") course.rain = el.checked;
  else if (id === "dFrom" || id === "dTo") { course[id === "dFrom" ? "from" : "to"] = el.value; if (id === "dFrom" && course.to && course.to <= course.from) course.to = ""; syncDates(); }
  else return;
  reroll();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") return closeDetail();
  if (e.key !== "Enter" && e.key !== " ") return;
  const z = e.target.closest?.(".zone");
  if (z) { e.preventDefault(); setPick(z.dataset.pick, true); }
});
{ const s = store.get("jeju-fs", "1"); if (s !== "1") { document.documentElement.classList.add("s" + s); document.querySelectorAll("[data-s]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.s === s))); } }
const h0 = (location.hash || "").slice(1);
route = (ROUTES.includes(h0) || RBY[h0]) ? h0 : "home";
if (RBY[route]) pick = route;
render();
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if ((ROUTES.includes(h) || RBY[h]) && h !== route) go(h); });
(async () => { try { sampleFn = window.claude ? await window.claude.use("sample") : null; } catch (e) { sampleFn = null; } })();
</script>
